# description

body: |-
  Closes #7
  Closes #8
  Closes #9
  
  Implementa modelagem de dados com schemas Frictionless e validação (Issues #7, #8, #9)
  Esta PR implementa a modelagem de dados do Classificador de Receita com 6 entidades alinhadas ao GSIM (ClassificationSeries, StatisticalClassification, ClassificationLevel, ClassificationItem, ClassificationVersion, ClassificationVariant). Os schemas Frictionless definem atributos, tipos de dados, constraints, PKs compostas e FKs, incluindo colunas temporais bitemporais (data_vigencia_* e data_registro_*) conforme ADR-001.
  Inclui datapackage.yaml principal, scripts de validação e geração de ERD (poetry run validar-schemas, poetry run gerar-erd), e DER gerado automaticamente. O modelo está normalizado em 3FN e pronto para validação com a DCAF.

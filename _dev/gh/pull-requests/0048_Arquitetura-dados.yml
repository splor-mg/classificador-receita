# description

body: |-
  Closes #4
  Closes #5
  Closes #6
  
  Este PR formaliza, por meio de ADRs padronizados, decisões essenciais para a arquitetura do projeto: adota-se um modelo bitemporal auditável no banco de dados PostgreSQL, garantindo rastreabilidade histórica robusta, e toma-se o GSIM v1.1 como referência conceitual para o classificador, promovendo alinhamento internacional e organização clara das versões. A documentação dessas escolhas segue um template unificado já incluído no repositório, permitindo governança e evolução transparente das soluções adotadas. A submissão encerra as demandas dos issues #4, #5 e #6 e está pronta para revisão.

    > Entender os dados que o datamart vai conter.
    
    @carloshob, só porque o nome das coisas importam, acredito que utilizar o termos datamart não seria o mais adequado para este processo. Coloco duas referências rápidas buscadas onlie para tomarmos esta decisão:
    
    -  [Database vs DataMart vs Data Warehouse vs Data Lake](https://stackoverflow.com/questions/61751650/database-vs-datamart-vs-data-warehouse-vs-data-lake).
    - [Database vs. Data Warehouse vs. Data Mart vs. Data Lake | Business Intelligence For Beginners
    ](https://www.youtube.com/watch?v=fcsXVJyxFbA).


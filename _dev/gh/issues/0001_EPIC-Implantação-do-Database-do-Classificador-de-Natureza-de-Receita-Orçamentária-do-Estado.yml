# description

body: |-
  ### Descrição
  
  O projeto tem como escopo central a migração e estruturação do classificador orçamentário da natureza de receita orçamentária do Estado, atualmente geridos em planilhas Excel, com versionamento fragmentado e controle manual, para uma arquitetura unificada em formato de database relacional, normalizado,  com rastreabilidade de versões e integração analítica dos dados.
  

# description

body: |-
  ### Descrição:
  
  Carregar dados históricos do Ementário Excel no banco, atribuindo transaction_time apropriado para cada registro histórico. Garantir que o histórico completo seja preservado e rastreável.
  
  ### Entregas:
  
  - Dados históricos carregados no banco
  - Transaction_time atribuído corretamente
  - Validação de completude histórica
  - Relatório de migração histórica
  - Aprovação da DCAF sobre dados migrados
  
  ### Observações:
  
  - Pode ser executada em paralelo com Issue #016
  - Transaction_time deve refletir data real de modificação quando disponível
  - Validar que não há gaps temporais críticos

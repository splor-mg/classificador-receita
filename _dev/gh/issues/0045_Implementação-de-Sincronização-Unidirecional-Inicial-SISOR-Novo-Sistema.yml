# description

body: |-
  ### Descrição:
  
  Implementar sincronização unidirecional inicial do SISOR para o novo sistema, permitindo importação inicial de classificações ativas. Esta funcionalidade é necessária para bootstrap do sistema.
  
  ### Entregas:
  
  - Sincronização unidirecional implementada
  - Importação de classificações ativas do SISOR
  - Mapeamento e transformação de dados
  - Validação de dados importados
  - Scripts de importação inicial
  - Testes de sincronização unidirecional
  
  ### Observações:
  
  - Importação inicial deve ser idempotente
  - Validar dados importados antes de carga
  - Considerar reconciliação com dados já existentes

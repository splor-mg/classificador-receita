# description

body: |-
  ### Descrição:
  
  Implementar mecanismo de detecção de mudanças no novo sistema, utilizando Django signals ou triggers PostgreSQL para identificar quando classificações são criadas, alteradas ou inativadas. Sistema deve registrar mudanças para sincronização.
  
  ### Entregas:
  
  - Sistema de detecção de mudanças implementado
  - Django signals ou triggers configurados
  - Fila de mudanças pendentes
  - Logging de mudanças
  - Testes de detecção de mudanças
  
  ### Observações:
  
  - Sistema deve ser eficiente e não impactar performance
  - Considerar uso de eventos assíncronos
  - Garantir que todas as mudanças sejam capturadas

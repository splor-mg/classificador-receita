  body: |-
    @gabrielbdornas, @Laura-Dilly e @marcelatsm, o issue foi fechado, pois as consultas históricas estão disponíveis por parâmetros temporais no gerenciador. O filtro RegistroAtivoFilter permite visualizar registros ativos no ano corrente, futuros, históricos (todas as linhas com data_registro_fim sentinela) e inativos; date_hierarchy permite navegação por data de vigência nas changelists. O comando atualizar_lista_abreviacoes aceita --as-of para operações com data de referência. A carga de seeds respeita data_registro_inicio/data_registro_fim e data_vigencia_inicio/data_vigencia_fim por linha (carregar_classificador).
    
    Desenvolvimento futuro: interface de seleção de data no dashboard público, managers as-of reutilizáveis e camada SQL otimizada para consultas point-in-time em grande volume.


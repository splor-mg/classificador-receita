# description

body: |-
  ### Descrição:
  
  Criar app Django dedicado para dashboard público (ou módulo no projeto existente), configurando rotas públicas, estrutura de views e templates. App deve ser separado da aplicação de gestão.
  
  ### Entregas:
  
  - App Django `dashboard` criado
  - Estrutura de diretórios configurada
  - Rotas públicas configuradas
  - Views base implementadas
  - Templates base criados
  - Configuração de URLs
  
  ### Observações:
  
  - App pode ser módulo do mesmo projeto ou aplicação separada
  - Rotas devem ser públicas (sem autenticação obrigatória)
  - Considerar separação de concerns (gestão vs consulta)

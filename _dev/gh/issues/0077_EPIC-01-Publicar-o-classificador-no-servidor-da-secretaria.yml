# description

body: |-
  Publicar o **classificador-receita** no EasyPanel da secretaria (**Easypanel Aid-Lab**) para que um mantenedor da AID abra o Django e faça a manutenção do classificador de receita.

  O painel é o plano de controle: `https://191.234.171.158/`. O login está no item do Bitwarden **Easypanel Aid - Lab**. O link do mantenedor é outro hostname, definido no mid-01. Não colar senhas neste issue nem no Git.

  Plano: `_dev/.epic/.epic-01_0-easypanel-deploy.md`.

  Subissues: #78 mid-01, #79 mid-02, #80 mid-03, #81 mid-04, #82 mid-05, #83 mid-06, #84 mid-07. O mid-00 é a abertura do plano e não tem issue.

  ## mid-01 — Inventariar o Aid-Lab no EasyPanel

  Subissue: #78

  - [ ] Entrar no EasyPanel Aid-Lab com o item do Bitwarden **Easypanel Aid - Lab**
  - [ ] Listar projetos, serviços, domínios e bancos já existentes
  - [ ] Nomear o projeto a usar (novo ou existente) e qualquer serviço já ligado a este app
  - [ ] Registrar se o GitHub está conectado
  - [ ] Escolher o caminho de deploy: repositório Git ligado ao painel, ou imagem construída em outro lugar (D13)
  - [ ] Propor o hostname público do app e confirmar que ele é distinto de `https://191.234.171.158/`
  - [ ] Escrever o inventário sem segredo do Bitwarden ou do painel

  ## mid-02 — Ler as configurações do Django pelo ambiente

  Subissue: #79

  - [ ] Ler `SECRET_KEY` do ambiente e não usar, no laboratório, a chave insegura gravada em `classificador/settings.py`
  - [ ] Ler `DEBUG` do ambiente
  - [ ] Ler `ALLOWED_HOSTS` e `CSRF_TRUSTED_ORIGINS` do ambiente
  - [ ] Ler nome, usuário, senha, host e porta do PostgreSQL do ambiente quando `USE_SQLITE` não estiver definido
  - [ ] Manter `USE_SQLITE=1`: `poetry run task migrate` e `poetry run task dev-server` continuam como no README
  - [ ] Com as variáveis do laboratório, o Django aceita o hostname do mid-01 e fala com um PostgreSQL que não é local
  - [ ] Listar cada variável do laboratório em `.env.example` como placeholder, e dizer que os valores reais ficam no EasyPanel e no Bitwarden

  ## mid-03 — Adicionar a imagem de container do Django

  Subissue: #80

  - [ ] Adicionar um `Dockerfile` para Python 3.12 e a instalação via Poetry
  - [ ] Adicionar um `.dockerignore` que exclui `.env`, `.venv` e arquivos de banco local
  - [ ] Adicionar um servidor WSGI (Gunicorn, salvo outra escolha no mid-01) e coletar os arquivos estáticos
  - [ ] O comando de início roda migrate e depois o servidor WSGI — não `manage.py runserver`
  - [ ] `docker build` conclui a partir de uma árvore limpa
  - [ ] O container escuta na porta que o EasyPanel vai proxiar
  - [ ] `GET /admin/login/` devolve a página de login do Django quando o banco está acessível
  - [ ] Reiniciar o container não apaga nem recarrega os dados do banco

  ## mid-04 — Provisionar o PostgreSQL no EasyPanel

  Subissue: #81

  - [ ] Criar ou adotar um serviço PostgreSQL no projeto Aid-Lab nomeado no mid-01
  - [ ] Criar um banco e um usuário dedicados a este app
  - [ ] Não reutilizar os padrões do README `postgres` / `postgres` como senha do laboratório
  - [ ] Guardar a senha do banco nos segredos do EasyPanel ou no Bitwarden, não no Git
  - [ ] Apontar as variáveis do mid-02 para esse serviço pela rede interna do painel
  - [ ] Confirmar que o banco continua no ar depois de um redeploy do container do app
  - [ ] Confirmar que o Django migra contra esse banco
  - [ ] Confirmar que a porta do banco não está publicada no host público

  ## mid-05 — Publicar o serviço e o hostname no EasyPanel

  Subissue: #82

  - [ ] Criar o serviço do app a partir da conexão Git ou da imagem escolhida no mid-01
  - [ ] Definir o ambiente do mid-02 no serviço, com `DEBUG` desligado
  - [ ] Anexar o hostname do mid-01 e o TLS que o EasyPanel oferece neste host
  - [ ] Proxiar para a porta do container do mid-03
  - [ ] Adicionar um health check em uma URL do Django
  - [ ] Abrir a URL do app em HTTPS, sem credencial do EasyPanel, e receber uma resposta do Django, não o login do painel
  - [ ] Fazer redeploy pelo branch ou pela imagem escolhida e atualizar o app em execução sem shell manual no host

  ## mid-06 — Carregar os dados e criar as contas de manutenção

  Subissue: #83

  - [ ] Depois da primeira migrate bem-sucedida, rodar `poetry run task carregar` uma vez
  - [ ] Criar um ou mais usuários staff do Django para os mantenedores da AID
  - [ ] Guardar essas senhas em um item do Bitwarden separado de **Easypanel Aid - Lab**
  - [ ] Entrar em `<app-url>/admin/` e abrir uma tela de manutenção do classificador
  - [ ] Fazer redeploy e confirmar que os dados carregados continuam presentes
  - [ ] Confirmar que nenhuma senha de staff foi commitada

  ## mid-07 — Entregar o link do Django a um mantenedor da AID

  Subissue: #84

  - [ ] Escrever um roteiro em `docs/instalacao/` com a URL do app, o caminho de login do Django e os nomes dos itens do Bitwarden (painel e Django)
  - [ ] Dizer a quem pedir uma conta
  - [ ] Deixar toda senha fora do roteiro
  - [ ] Abrir a URL do roteiro no navegador, sem credencial do EasyPanel, e ver a página de login do Django
  - [ ] Um colega da AID que não é o operador do deploy entra com o próprio usuário Django e chega a uma tela de manutenção

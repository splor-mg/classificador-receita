# description

body: |-
  ### Descrição:
  
  Desenvolver interface responsiva do dashboard usando CSS moderno e JavaScript, garantindo que funcione bem em diferentes dispositivos (desktop, tablet, mobile). Interface deve seguir princípios de UX/UI.
  
  ### Entregas:
  
  - Interface responsiva implementada
  - CSS moderno e organizado
  - JavaScript para interatividade
  - Testes em diferentes dispositivos
  - Acessibilidade implementada
  - Documentação de interface
  
  ### Observações:
  
  - Considerar uso de framework CSS (Bootstrap, Tailwind) ou CSS custom
  - Garantir acessibilidade (WCAG)
  - Testar em navegadores principais

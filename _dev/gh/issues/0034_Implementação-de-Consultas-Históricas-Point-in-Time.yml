# description

body: |-
  ### Descrição:
  
  Implementar funcionalidade de consultas históricas (point-in-time queries) no dashboard, permitindo que usuários consultem estado do classificador em datas específicas. Utilizar SQL raw para consultas temporais complexas.
  
  ### Entregas:
  
  - Views Django para consultas históricas
  - Interface para seleção de data
  - Consultas point-in-time implementadas
  - Visualização de histórico
  - Testes de consultas históricas
  
  ### Observações:
  
  - Consultas devem usar SQL raw para bitemporalidade
  - Validar performance de consultas históricas
  - Interface deve ser intuitiva para seleção de data

# description

body: |-
  ### Descrição:
  
  Implementar sistema de busca e filtros avançados no dashboard, permitindo busca por código, descrição, nível hierárquico, período de vigência, etc. Sistema deve usar queries otimizadas do Django.
  
  ### Entregas:
  
  - Sistema de busca implementado
  - Filtros avançados funcionais
  - Forms Django para busca e filtros
  - Queries otimizadas (select_related, prefetch_related)
  - Interface de busca e filtros
  - Testes de busca e filtros
  
  ### Observações:
  
  - Busca deve ser performática mesmo com grandes volumes
  - Considerar uso de índices PostgreSQL
  - Implementar busca full-text se necessário

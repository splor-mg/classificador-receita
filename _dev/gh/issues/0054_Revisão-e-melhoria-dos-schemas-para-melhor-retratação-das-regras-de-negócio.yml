    @gabrielbdornas, uma dúvida que ficou sobre o `git rebase`. 
    
    Conforme é possível ver acima, eu fiz duas menções a esse issue (#54) por equívoco, quando na verdade a intenção era fazer menção ao #53. 
    
    ```
    ➜  classificador-receita git:(banco) git log --oneline
    04b279b (HEAD -> banco, origin/banco) chore(assets): adiciona arquivo de exemplo do ementário de receita MG See https://github.com/splor-mg/classificador-receita/issues/53
    5a8d160 chore(gitignore): remove temporariamente arquivos de data .xls e .csv See https://github.com/splor-mg/classificador-receita/issues/53
    d28e6ff docs(django): adiciona anotações sobre implementação do Django no projeto See https://github.com/splor-mg/classificador-receita/issues/54
    1037bab feat(django): implementa arquivos iniciais do projeto django See https://github.com/splor-mg/classificador-receita/issues/54
    5c8cdc4 feat(gitignore): adiciona arquivos de desenvolvimento e gerenciamento de Django See https://github.com/splor-mg/classificador-receita/issues/53
    ```
    
    Para corrigir tal erro, eu fiz o `git rebase` com a devida correção da descrição do commit:
    
    ```
    ➜  classificador-receita git:(banco) git rebase -i 5c8cdc4
    [detached HEAD 9222899] feat(django): implementa arquivos iniciais do projeto django See https://github.com/splor-mg/classificador-receita/issues/53
     Date: Fri Jan 23 14:15:04 2026 -0300
     6 files changed, 194 insertions(+)
     create mode 100644 classificador/__init__.py
     create mode 100644 classificador/asgi.py
     create mode 100644 classificador/settings.py
     create mode 100644 classificador/urls.py
     create mode 100644 classificador/wsgi.py
     create mode 100755 manage.py
    [detached HEAD 23d79d0] docs(django): adiciona anotações sobre implementação do Django no projeto See https://github.com/splor-mg/classificador-receita/issues/53
     Date: Fri Jan 23 14:15:57 2026 -0300
     1 file changed, 42 insertions(+)
     create mode 100644 _dev/spec_django.md
    Successfully rebased and updated refs/heads/banco.
    ➜  classificador-receita git:(banco) git push --force-with-lease origin banco
    Enumerating objects: 25, done.
    Counting objects: 100% (25/25), done.
    Delta compression using up to 16 threads
    Compressing objects: 100% (19/19), done.
    Writing objects: 100% (21/21), 843.61 KiB | 5.17 MiB/s, done.
    Total 21 (delta 8), reused 0 (delta 0), pack-reused 0
    remote: Resolving deltas: 100% (8/8), completed with 4 local objects.
    To github.com:splor-mg/classificador-receita.git
     + 04b279b...fd4a78f banco -> banco (forced update)
    ```
    
    Como a lógica do `rebase`, smj, é a reconstrução do histórico, eu esperava que este issue parasse de fazer menção aos commits anteriores com a mensagem equivocada, porém a referência continua aqui. 
    
    Fiz algo errado no rebase ou é uma inconsistência/regra de negócio do GitHub? 
    
    
    
    


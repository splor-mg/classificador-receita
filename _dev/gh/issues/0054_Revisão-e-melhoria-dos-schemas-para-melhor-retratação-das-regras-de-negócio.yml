# description

body: |-
  ### Descrição
  
  Ao criar a primeira versão dos schemas em #49, a retratação ERD das chaves primária e estrangeira não ficou satisfatória, conforme [comentado](https://github.com/splor-mg/classificador-receita/pull/49#discussion_r2643887340). 
  
  Além disso, foi feita a ponderação de necessidade de melhorias na explicação dos campos/atributos, por exemplo, com melhor exploração das propriedades dos atributos (e.x.: `description`) e eventual inclusão de exemplos, conforme [este comentário](https://github.com/splor-mg/classificador-receita/pull/49#discussion_r2643893010).

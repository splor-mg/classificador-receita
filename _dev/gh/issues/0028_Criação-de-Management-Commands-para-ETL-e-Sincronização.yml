# description

body: |-
  ### Descrição:
  
  Criar Django management commands para operações de ETL e sincronização, permitindo execução de tarefas administrativas via linha de comando. Commands devem suportar operações de migração, sincronização e manutenção.
  
  ### Entregas:
  
  - Management commands para ETL
  - Management commands para sincronização
  - Commands para manutenção e validação
  - Documentação de uso dos commands
  - Testes dos management commands
  
  ### Observações:
  
  - Commands devem ser idempotentes quando possível
  - Implementar logging adequado
  - Considerar uso em scripts automatizados e cron jobs

# description

body: |-
  ### Descrição:
  
  Criar models Django que mapeiam as tabelas do banco bitemporal, utilizando `managed=False` para indicar que as tabelas já existem. Implementar custom Managers e QuerySets para facilitar consultas temporais.
  
  ### Entregas:
  
  - Models Django para todas as entidades principais
  - Models configurados com `managed=False`
  - Custom Managers para consultas as-of
  - Custom QuerySets para queries temporais
  - Documentação dos models
  
  ### Observações:
  
  - Models devem refletir exatamente a estrutura do banco
  - Custom Managers devem facilitar consultas bitemporais
  - Considerar uso de `Meta.db_table` para nomes de tabelas

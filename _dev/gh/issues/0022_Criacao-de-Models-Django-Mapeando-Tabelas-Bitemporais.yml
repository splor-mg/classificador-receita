  body: |-
    @gabrielbdornas, @Laura-Dilly  e @marcelatsm, o issue foi fechado pois os models Django das entidades principais do classificador estão implementados em apps/core/models.py, models_base_legal.py e models_alias_lexico.py, com a classe base BitemporalModel (campos de vigência e de registro), constraints de unicidade bitemporal, índices temporais e migration inicial (apps/core/migrations/0001_initial.py). O registro central das entidades e do mapeamento com os schemas Frictionless está em apps/core/bitemporal_registry.py; a documentação da implementação está em _dev/spec_django.md.
    
    A abordagem adotada foi ORM como fonte de verdade do esquema (managed=True), em vez de managed=False sobre tabelas pré-existentes — decisão alinhada ao MVP Django (#53).
    
    Desenvolvimento futuro: custom Managers/QuerySets para consultas as-of reutilizáveis e eventual camada SQL dedicada, se a demanda de performance ou de consultas complexas justificar.


# description

body: |-
  ### Descrição:
  
  Otimizar performance do dashboard através de cache, índices adicionais, otimização de queries (select_related, prefetch_related) e outras técnicas. Garantir que dashboard responda rapidamente mesmo com grandes volumes de dados.
  
  ### Entregas:
  
  - Cache implementado (Redis ou Memcached)
  - Índices PostgreSQL otimizados
  - Queries otimizadas
  - Análise de performance realizada
  - Relatório de otimizações
  - Testes de carga
  
  ### Observações:
  
  - Cache deve ser invalidado adequadamente
  - Considerar cache de queries, templates e objetos
  - Validar performance em ambiente de produção simulado

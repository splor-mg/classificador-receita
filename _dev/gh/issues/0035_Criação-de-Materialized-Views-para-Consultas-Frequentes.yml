# description

body: |-
  ### Descrição:
  
  Criar materialized views no PostgreSQL para otimizar consultas frequentes do dashboard, especialmente para visualização hierárquica e consultas de classificações vigentes. Implementar estratégia de atualização das views.
  
  ### Entregas:
  
  - Materialized views criadas
  - Estratégia de atualização definida
  - Scripts de refresh das views
  - Integração com Django
  - Documentação das views
  - Testes de performance
  
  ### Observações:
  
  - Views devem ser atualizadas automaticamente ou sob demanda
  - Considerar trade-off entre atualização frequente e performance
  - Documentar quando usar views vs queries diretas

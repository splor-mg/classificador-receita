# description

body: |-
  ### Descrição:
  
  Customizar Django Admin para gestão administrativa do classificador, incluindo filtros personalizados, ações em massa, visualizações hierárquicas e relatórios. Admin deve facilitar gestão operacional.
  
  ### Entregas:
  
  - Django Admin customizado
  - Filtros personalizados implementados
  - Ações em massa configuradas
  - Visualizações hierárquicas
  - Relatórios administrativos
  - Documentação de uso do admin
  
  ### Observações:
  
  - Admin deve ser intuitivo para usuários não-técnicos
  - Considerar performance em grandes volumes de dados
  - Implementar exportação de dados quando necessário

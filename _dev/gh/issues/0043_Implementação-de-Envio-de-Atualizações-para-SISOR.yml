# description

body: |-
  ### Descrição:
  
  Implementar lógica de envio de atualizações para SISOR, incluindo criação, alteração e inativação de classificações. Sistema deve fazer chamadas à API do SISOR e tratar respostas adequadamente.
  
  ### Entregas:
  
  - Cliente de API do SISOR implementado
  - Envio de criações implementado
  - Envio de alterações implementado
  - Envio de inativações implementado
  - Tratamento de respostas do SISOR
  - Testes de envio de atualizações
  
  ### Observações:
  
  - Implementar tratamento robusto de erros
  - Validar dados antes de envio
  - Considerar validação de resposta do SISOR

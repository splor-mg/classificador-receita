# description

body: |-
  ### Descrição:
  
  Implementar integração completa com banco bitemporal, utilizando SQL raw para consultas temporais complexas (as-of, point-in-time). Criar abstrações que facilitem uso de consultas temporais na aplicação.
  
  ### Entregas:
  
  - Funções/utilitários para consultas SQL raw
  - Integração de consultas temporais em views
  - Abstrações para consultas as-of
  - Documentação de padrões de consulta
  - Testes de integração com banco bitemporal
  
  ### Observações:
  
  - SQL raw deve ser usado apenas quando necessário
  - Documentar todas as queries SQL raw
  - Considerar uso de prepared statements para segurança

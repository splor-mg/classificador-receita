  body: |-
    @gabrielbdornas, @Laura-Dilly e @marcelatsm, o issue foi fechado, pois a aplicação Django está integrada ao banco bitemporal de ponta a ponta. Os models (apps/core/models.py), a migration inicial, o registry de recursos (bitemporal_registry.py) e o serviço de escrita (bitemporal_update.py / apply_bitemporal_update) garantem leitura e gravação conforme as regras de vigência e de registro (ADR-001 e ADR-004). No Admin, BitemporalChangeHandler e os mixins bitemporais conectam formulários, confirmações e persistência temporal.
    
    Para consultas, a camada ORM concentra o uso diário: transaction_time_sentinel_for_query(), RegistroAtivoFilter e filtros de domínio aplicam critérios temporais (ativo corrente, histórico, futuro, inativo) diretamente nas changelists e lookups de FK. O SQL raw entra onde o ORM não atende bem — exportação em massa com COPY e JOIN de FKs semânticas (exporter.py), carga e manutenção de tabelas (carregar_classificador, drop_core_tables) — sempre documentado no código e alinhado ao registry.
    
    Os padrões de consulta temporal estão descritos em _dev/spec_django.md, nos ADRs e nos comentários dos módulos bitemporal_* e admin_mixins.py.
    
    Desenvolvimento futuro: managers/QuerySets as-of reutilizáveis, camada SQL dedicada para consultas point-in-time de alto volume no dashboard público e suíte tests/integration/ com execução em CI/CD.


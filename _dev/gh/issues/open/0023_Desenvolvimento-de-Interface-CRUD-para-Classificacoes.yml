  body: |-
    @gabrielbdornas, @Laura-Dilly  e @marcelatsm, o issue foi fechado pois o CRUD operacional do classificador está implementado no Django Admin (apps/core/admin.py, admin_handlers.py, admin_mixins.py), com criação, leitura, edição, bloqueio, exclusão lógica e reativação de registros bitemporais. O fluxo de edição inclui tela de confirmação com diff de atributos e estratégias de atualização (templates/admin/core/bitemporal_confirm.html). Para ItemClassificacao, há navegação por código, criação de filho a partir do item mãe, validações de hierarquia e endpoints JSON de apoio ao formulário.
    
    O Admin foi definido como interface principal de gestão do classificador, conforme _dev/spec_django.md e o escopo do MVP (#53).
    
    Desenvolvimento futuro: views/forms/templates dedicados fora do Admin, tendo em vista necessidade de interface pública ou de perfis de usuário distintos do operador administrativo.
    
    


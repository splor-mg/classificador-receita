# description

body: |-
  ### Descrição:
  
  Desenvolver interface completa de CRUD (Create, Read, Update, Delete) para classificações usando Django views, forms e templates. Interface deve permitir criação, visualização, edição e inativação de classificações.
  
  ### Entregas:
  
  - Views Django (class-based ou function-based)
  - Forms Django com validação
  - Templates HTML para CRUD
  - Navegação e UX implementada
  - Testes unitários das views
  
  ### Observações:
  
  - Usar class-based views quando apropriado
  - Implementar validação tanto no form quanto no model
  - Considerar UX/UI moderna e responsiva

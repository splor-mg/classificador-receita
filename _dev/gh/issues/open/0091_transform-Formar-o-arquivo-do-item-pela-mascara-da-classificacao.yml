  body: |-
    O pedido normalize --text receita_descricao no arquivo de 2004 parou em A linha 15, coluna 'receita_descricao', não é texto. Nenhuma aspa foi trocada. A linha do 11120400 vem embrulhada por aspas, porque a descrição contém ;. O leitor tratou " como aspa de campo, devolveu o registro com duas colunas e a descrição não estava lá.
    
    receita_descricao é a última coluna. O fim dela é o fim da linha, não um ";. O ajuste corta pelo separador que o cabeçalho indica: dois ; separam código e nome, e o resto da linha é a descrição, inclusive outro ;. Uma linha embrulhada perde o par externo antes desse corte, e as aspas dobradas voltam a ser uma. No trecho da coluna, aspas duplas viram aspas simples. Na gravação, um par estrutural só entra no campo que ainda contém ;.
    
    Com isso o arquivo segue com as 1002 linhas. A descrição do 11120400 guarda o ; de ambos; b) e a grade deixa de engolir as linhas seguintes, porque a aspa do texto não fica mais aberta.

  body: |-
    @gabrielbdornas, @Laura-Dilly e @marcelatsm, o issue foi fechado, pois o controle de alterações no classificador está implementado como protocolo de edição com guardrails no Django Admin. Antes de efetivar mudanças em entidades bitemporais, o operador passa por confirmação explícita (BitemporalChangeHandler), escolhendo estratégia de atualização (sobrescrever registro ou abrir nova vigência). As alterações são validadas em camadas de formulário, model e regras de negócio (apps/core/code_*.py), com bloqueios e alertas para situações como substituição indevida de receita_cod, conflitos de vigência, incoerência hierárquica, salto de nível e validação de nomenclatura (guardrails G0/G1 em code_name_*.py).
    
    Esse modelo garante rastreabilidade bitemporal (histórico preservado por SCD-2) e impede alterações inconsistentes antes da gravação.
    
    Desenvolvimento futuro: workflow multiusuário com submissão, revisão e aprovação por perfis distintos (DCAF/auditores), notificações e painel de solicitações pendentes.


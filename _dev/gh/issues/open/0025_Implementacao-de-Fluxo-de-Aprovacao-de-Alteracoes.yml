# description

body: |-
  ### Descrição:
  
  Implementar workflow de aprovação para alterações no classificador, permitindo que alterações sejam submetidas, revisadas e aprovadas antes de serem efetivadas. Sistema deve rastrear status de cada solicitação.
  
  ### Entregas:
  
  - Model de workflow implementado
  - Views para submissão e aprovação
  - Notificações de mudanças de status
  - Interface de gestão de aprovações
  - Histórico de aprovações
  - Testes do workflow
  
  ### Observações:
  
  - Considerar uso de bibliotecas como django-workflows ou implementação custom
  - Workflow deve integrar com sistema bitemporal
  - Notificações podem ser por email ou in-app

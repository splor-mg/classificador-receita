# description

body: |-
  O nível hierárquico passa a declarar se admite só Matriz, só Detalhe ou ambos, para o Salvar do item ter uma fonte da verdade.
  
  ## Context
  
  `nivel_hierarquico` guarda a máscara em `estrutura_codigo` e não diz se aquele nível só pode ter código agregador, só detalhe, ou os dois. Sem esse dado, o formulário de item aceita Detalhe num nível que deveria ser só Matriz, e o inverso.
  
  ## Objective
  
  Cada nível hierárquico tem o campo Agregação (`agregacao`), com os valores Híbrido, Matriz e Detalhe. O padrão é Híbrido.
  
  ## Scope
  
  **In scope:**
  
  - Campo `agregacao` em `NivelHierarquico` / tabela `nivel_hierarquico`, exposto no admin como Agregação.
  - Valores: Híbrido (padrão), Matriz, Detalhe.
  - Registros já existentes nascem Híbrido.
  - Schema e carga do nível acompanham o campo.
  
  **Out of scope:**
  
  - Recusar o Salvar do item quando o identificador de matriz não cabe na Agregação. Isso é #86.
  - Preencher quais níveis deixam de ser Híbrido. Isso é dado, depois que o campo existir.
  - Plano de epic e implementação do fluxo de filho.
  
  ## Acceptance criteria
  
  - [ ] O admin de Nível Hierárquico mostra Agregação com Híbrido, Matriz e Detalhe.
  - [ ] Um nível novo sem escolha explícita fica Híbrido.
  - [ ] Um nível já gravado continua Híbrido até alguém alterar.
  - [ ] `estrutura_codigo` permanece a máscara de dígitos.
  
  ## Implementation notes
  
  - **Area / scope label:** `nivel`
  - **Hints:** `apps/core/models.py` (`NivelHierarquico`), admin do nível, schema Frictionless de `nivel_hierarquico`, seed e comando de carga.
  

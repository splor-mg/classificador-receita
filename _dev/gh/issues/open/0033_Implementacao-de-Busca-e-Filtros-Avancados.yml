  body: |-
    @gabrielbdornas, @Laura-Dilly e @marcelatsm, o issue foi fechado, pois a busca e filtros estão implementados no gerenciador (Django Admin), com search_fields por código, nome e identificadores semânticos nas entidades principais, e filtros laterais especializados em admin_filters.py e admin_mixins.py: status do registro (ativo corrente, futuro, histórico, inativo), prefixos de categoria/origem MG, nível hierárquico, matriz/detalhe, vigência (date_hierarchy) e filtros semânticos de FK. A changelist de ItemClassificacao abre por padrão com filtro «Ativos (Ano Corrente)», com testes em tests_admin_changelist_default_filters.py.
    
    Desenvolvimento futuro: mesma capacidade de busca e filtros no dashboard público (#31), com interface dedicada e eventual busca full-text.


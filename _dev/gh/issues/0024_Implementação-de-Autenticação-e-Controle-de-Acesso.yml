# description

body: |-
  ### Descrição:
  
  Implementar sistema de autenticação Django completo, incluindo login, logout, recuperação de senha, e controle de acesso baseado em perfis (DCAF, auditores). Configurar grupos e permissões.
  
  ### Entregas:
  
  - Sistema de autenticação funcional
  - Perfis de usuário implementados
  - Grupos e permissões configurados
  - Controle de acesso em views
  - Templates de autenticação
  - Testes de autenticação e autorização
  
  ### Observações:
  
  - Seguir boas práticas de segurança Django
  - Considerar integração com sistema de autenticação corporativo (se aplicável)
  - Implementar logging de ações de usuários

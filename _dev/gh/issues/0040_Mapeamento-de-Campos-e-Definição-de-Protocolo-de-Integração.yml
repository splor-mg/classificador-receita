# description

body: |-
  ### Descrição:
  
  Mapear campos do novo sistema para campos do SISOR, definindo transformações necessárias e protocolo completo de integração. Documentar mapeamento e regras de transformação.
  
  ### Entregas:
  
  - Matriz de mapeamento de campos
  - Protocolo de integração documentado
  - Regras de transformação definidas
  - Tratamento de conflitos documentado
  - Documentação técnica completa
  
  ### Observações:
  
  - Mapeamento deve ser validado com Prodemge
  - Considerar diferenças entre SISOR atual e futuro (2026)
  - Documentar decisões sobre tratamento de dados

# description

body: |-
  ### Descrição:
  
  Criar serviço de sincronização usando Celery para tarefas assíncronas, implementando workers que processam fila de sincronizações pendentes. Serviço deve suportar retry automático e tratamento de erros.
  
  ### Entregas:
  
  - Serviço de sincronização Celery implementado
  - Workers Celery configurados
  - Tarefas de sincronização criadas
  - Sistema de fila implementado
  - Retry logic implementado
  - Testes do serviço de sincronização
  
  ### Observações:
  
  - Celery deve ser configurado com broker (Redis ou RabbitMQ)
  - Implementar retry com backoff exponencial
  - Considerar priorização de sincronizações

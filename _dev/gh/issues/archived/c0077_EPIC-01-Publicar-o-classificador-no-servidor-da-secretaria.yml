# description

body: |-
  # Descrição
  
  Publicar o **classificador-receita** no servidor da secretaria para que um mantenedor da AID abra o Django e faça a manutenção do classificador de receita, sem precisar administrar o servidor.
  
  Há duas portas. `https://191.234.171.158/` é o EasyPanel **Aid-Lab**, o painel em que se criam serviços. O login desse painel está no Bitwarden, item **Easypanel Aid - Lab**. A outra porta é o link do Django, ainda sem hostname: é o endereço que a equipe AID vai usar no dia a dia. Esse hostname sai do mid-01. Senhas não entram neste issue nem no Git.
  
  Este issue é o mapa. Cada mid abaixo diz o objetivo e o status, e aponta o subissue em que o cenário está explicado para quem for reproduzir o passo. Ponderações e decisões ficam no plano `_dev/.epic/.epic-01_0-easypanel-deploy.md`. O mid-00 é a abertura desse plano e não tem issue.
  
  ## mid-01 — Inventariar o Aid-Lab no EasyPanel
  
  Issue: #78
  Status: `pending`
  Objetivo: saber o que já existe no painel (projeto, serviços, domínio, banco, conexão com o Git) antes de criar qualquer coisa, e separar o hostname do app do endereço do painel.
  
  ## mid-02 — Ler as configurações do Django pelo ambiente
  
  Issue: #79
  Status: `pending`
  Objetivo: o laboratório lê segredo, debug, hosts e banco a partir de variáveis; o desenvolvimento local com `USE_SQLITE=1` continua como no README.
  
  ## mid-03 — Adicionar a imagem de container do Django
  
  Issue: #80
  Status: `pending`
  Objetivo: uma imagem sobe o Django com servidor de produção e migrate na partida, sem `runserver` e sem recarregar os dados a cada restart.
  
  ## mid-04 — Provisionar o PostgreSQL no EasyPanel
  
  Issue: #81
  Status: `pending`
  Objetivo: um PostgreSQL do painel guarda os dados do laboratório e sobrevive ao redeploy do app. A senha não é a do README e não vai para o Git.
  
  ## mid-05 — Publicar o serviço e o hostname no EasyPanel
  
  Issue: #82
  Status: `pending`
  Objetivo: o app responde em HTTPS num endereço que não é o login do painel, com `DEBUG` desligado.
  
  ## mid-06 — Carregar os dados e criar as contas de manutenção
  
  Issue: #83
  Status: `pending`
  Objetivo: o banco do laboratório recebe uma carga inicial e pelo menos uma conta staff da AID, com senha só no Bitwarden.
  
  ## mid-07 — Entregar o link do Django a um mantenedor da AID
  
  Issue: #84
  Status: `pending`
  Objetivo: um colega que não administra o EasyPanel entra no Django pelo link publicado e chega a uma tela de manutenção.

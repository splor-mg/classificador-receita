# description

body: |-
  ### Descrição
  
  Gerar um artefato de contexto compilado e indexado por IDs normativos para que assistentes de IA consultem regras sem carregar dezenas de specs inteiras a cada tarefa.
  
  ## Contexto
  
  O mesmo problema que motivou a refatoração das specs — **alto gasto de tokens** e **baixa manutenibilidade** — manifesta-se na forma como o desenvolvimento assistido por IA consome `_dev/spec_*.md` hoje: arquivos extensos, estruturas diversas e símbolos legados dificultam seleção de contexto; o repositório **ainda não possui** `_dev/.sdd-context.yaml` (ou equivalente) gerado de forma reproduzível.
  
  A definição de um **contrato de compilação** pode produzir chunks por `PREFIX-NN` com resumo, tema, seção e artefatos — reduzindo necessidade de `@` em specs completas no chat.
  
  Sem compilação, mesmo após refactor manual, o operador continua dependente de leitura integral de múltiplos arquivos; com compilação, o fluxo passa a: **índice → IDs relevantes → trechos**, com custo previsível de contexto.
  
  ## Objective
  
  Existir um **texto compilado** (YAML/índice SDD) no repositório, regenerável a partir de `_dev/spec_*.md` locais refatoradas, que suporte consulta por ID, tema e escopo de paths para assistentes e ferramentas. (**AGENTS-33**).
  

# description

body: |-
  ### Descrição:
  
  Definir as entidades principais do modelo de dados (classificacao_receita, nivel_hierarquico, versao_classificacao, etc.) e seus atributos essenciais, conforme modelo GSIM e requisitos do Ementário Excel. Esta issue estabelece a estrutura conceitual do banco de dados.
  
  ### Entregas:
  
  - Lista completa de entidades principais
  - Definição de atributos por entidade
  - Tipos de dados propostos
  - Documentação de cada entidade e seu propósito
  - Validação com DCAF sobre cobertura de campos do Excel

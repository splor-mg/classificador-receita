# description

body: |-
  _[ [Gravação do encontro](https://youtu.be/LBJR5TchcbI) | [Reunião anterior](https://github.com/splor-mg/classificador-receita/issues/72) | [Próxima reunião](https://github.com/splor-mg/classificador-receita/issues/74) ]_
  
  ### Descrição
  
  Encontro da série **Operacionalização do MLP** dedicado ao início do **uso assistido** das ferramentas e protocolos já implementados no gerenciador (Django Admin). 
  
  Cada encontro combina (i) **revisão dos conceitos centrais** que sustentam o modelo de dados e as regras de negócio do classificador, (ii) **repasse das implementações** disponíveis para operação, (iii) **testes práticos** sobre o gerenciador e (iv) coleta de **observações de uso** que possam indicar ajustes no modelo, na interface ou nos protocolos.
  
  ## Pauta
  - terceiro encontro de operacionalização do MLP
  - encaminhamentos da [reunião de 21/05](https://github.com/splor-mg/classificador-receita/issues/64)
  
  ## Participantes
  - @carloshob
  - @GuilhermeReisSeplag 
  - @Laura-Dilly
  - @marcelatsm
  
  ## Assuntos tratados
  - [Navegação estrutural por setas na change de ItemClassificacao](https://github.com/splor-mg/classificador-receita/issues/64#:~:text=7.%20Navega%C3%A7%C3%A3o%20estrutural%20por%20setas%20na%20change%20de%20ItemClassificacao)
  
  - [Implementação da Documentação Orienta a Especificação de Domínio (SDD)](https://github.com/splor-mg/classificador-receita/issues/64#:~:text=8.%20Implementa%C3%A7%C3%A3o%20da%20Documenta%C3%A7%C3%A3o%20Orienta%20a%20Especifica%C3%A7%C3%A3o%20de%20Dom%C3%ADnio%20(SDD))
  
  ## Encaminhamentos
  - Encontro final destinado à apresentação do projeto no servidor, marcado para 15/06, às 10:30

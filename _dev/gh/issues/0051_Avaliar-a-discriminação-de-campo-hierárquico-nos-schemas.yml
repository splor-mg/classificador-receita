# description

body: |-
  ### Descrição
  
  Após primeira versão dos schemas do projeto, @gabrielbdornas [questionou](https://github.com/splor-mg/classificador-receita/pull/49#discussion_r2643896694): 
  
  "já que o nosso [banco] será sempre hierárquica, precisamos mesmo deste campo? Ele é condição fundamental para funcionamento do modelo proposto?"
  
  Como suspeitava que a identificação de um objeto como hierárquico ou não poderia sim impactar o modelo, registrei o questionamento neste issue para avaliação posterior.

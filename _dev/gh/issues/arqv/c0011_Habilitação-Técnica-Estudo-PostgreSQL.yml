# description

body: |-
  ### Descrição:
  
  Realizar estudo e capacitação em PostgreSQL, cobrindo tipos de dados, triggers, funções, extensões e Dockerização. Esta issue garante que a equipe tenha competência técnica necessária em PostgreSQL para implementação do banco de dados.
  
  ### Entregas:
  
  - Conclusão de cursos de PostgreSQL:
    - [Curso completo de PostgreSQL](https://www.udemy.com/course/curso-de-postgresql/?couponCode=CP251120G2V2)
    - [Curso de FastAPI 2025 - Dockerizando a nossa aplicação e introduzindo o PostgreSQL - Eduardo Mendes](https://www.youtube.com/watch?v=faf7jhti5tg)
  - Ambiente Docker local configurado (PostgreSQL + volumes)
  - Exercícios práticos de PostgreSQL (tipos de dados, triggers, funções, extensões)
  - Documentação de aprendizados e referências
  
  ### Observações:
  
  - Esta issue pode ser executada em paralelo com outras atividades
  - Priorizar estudos práticos com exercícios hands-on
  - Manter registro de dúvidas e soluções encontradas
  - Foco em: tipos de dados (TEXT, TIMESTAMP, JSONB), triggers (BEFORE INSERT, AFTER UPDATE), funções PostgreSQL, extensões (temporal_tables, pg_partman), Dockerização
  

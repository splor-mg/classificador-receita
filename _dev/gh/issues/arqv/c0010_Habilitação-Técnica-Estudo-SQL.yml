# description

body: |-
  ### Descrição:
  
  Realizar estudo e capacitação em SQL, cobrindo sintaxe básica, DDL e consultas avançadas. Esta issue garante que a equipe tenha competência técnica necessária em SQL para implementação do banco de dados.
  
  ### Entregas:
  
  - Conclusão de cursos de SQL:
    - [Curso FGV SQL](https://educacao-executiva.fgv.br/cursos/online/curta-media-duracao-online/sql-structured-query-language)
    - [CS50's Introduction to Databases with SQL](https://pll.harvard.edu/course/cs50s-introduction-databases-sql)
  - Exercícios práticos de SQL (sintaxe básica, DDL, JOIN, GROUP BY, subconsultas)
  - Documentação de aprendizados e referências
  
  ### Observações:
  
  - Esta issue pode ser executada em paralelo com outras atividades
  - Priorizar estudos práticos com exercícios hands-on
  - Manter registro de dúvidas e soluções encontradas
  - Foco em: SELECT, INSERT, UPDATE, DELETE, CREATE TABLE, ALTER, constraints, JOIN, GROUP BY, subconsultas
  

# description

body: |-
  ### Descrição:
  
  Estudar e adotar o [GSIM (Generic Statistical Information Model)](https://unece.org/statistics/publications/generic-statistical-information-model-version-20-user-guide) como referência conceitual para modelagem do classificador. Adaptar o modelo GSIM às necessidades específicas do Classificador de Natureza de Receita do Estado de Minas Gerais, garantindo alinhamento com padrões internacionais.
  
  ### Entregas:
  
  - ADR-002: Adoção do modelo GSIM
  - Documentação sobre GSIM Statistical Classifications Model
  - Mapeamento de conceitos GSIM para domínio do classificador
  - Adaptações necessárias ao modelo base
  - Revisão e aprovação pela DCAF

# description

body: |-
  ### Descrição:
  
  Implementar triggers PostgreSQL para gerenciar automaticamente a bitemporalidade, garantindo que transaction_time seja preenchido automaticamente e que valid_time seja gerenciado corretamente em operações de INSERT, UPDATE e DELETE.
  
  ### Entregas:
  
  - Triggers BEFORE INSERT para transaction_time
  - Triggers AFTER UPDATE para versionamento
  - Funções PostgreSQL para lógica bitemporal
  - Testes SQL para validar triggers
  - Documentação de triggers e funções
  
  ### Observações:
  
  - Triggers devem ser testados extensivamente
  - Considerar performance impact de triggers
  - Documentar comportamento esperado de cada trigger
  

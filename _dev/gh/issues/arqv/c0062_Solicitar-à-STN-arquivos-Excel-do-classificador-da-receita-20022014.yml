    ## Resposta STN
    
    Prezado Carlos Henrique,
    
    As naturezas de receita foram estabelecidas pela Secretaria do Tesouro Nacional (STN) e pela Secretaria de Orçamento Federal (SOF) a partir da Portaria Interministerial nº 163/2001.
    
    A primeira atualização ocorreu em 2004, com a publicação da 1ª edição do Manual de Receita Nacional, que permaneceu em constante revisão até o exercício de 2008.
    
    Somente a partir de 2009 passou a vigorar o MCASP propriamente dito, por meio do qual se deu a atualização do ementário de natureza de receita.
    
    O ementário em formato Excel passou a ser disponibilizado apenas em 2015, com a publicação da 6ª edição do MCASP.
    
    Dessa forma, encaminhamos em anexo os arquivos disponíveis com as naturezas de receita referentes aos exercícios de 2002 a 2014.
    
    Atenciosamente,
    
    Gerência de Normas e Procedimentos Contábeis – GENOC/CNORM/CCONF/SUCON-STN
    


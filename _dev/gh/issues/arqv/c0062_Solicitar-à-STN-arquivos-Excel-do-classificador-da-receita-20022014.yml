    ## Protocolo aberto junto à STN - 16/03/2026
    
    _chamado: **CH202605231**_
    
    Prezadas(os), boa tarde!
    
    Meu nome é Carlos Henrique e trabalho na Assessoria de Inteligência de Dados (AID), da Subsecretaria de Planejamento e Orçamento do Estado de Minas Gerais (SPLOR/SEPLAG).
    
    Estamos conduzindo um projeto de modelagem e construção de ferramentas voltadas à modernização da gestão de nossos bancos taxonômicos (a exemplo dos ementários), inspirados, entre outros referenciais, pelo [GSIM](https://unece.org/statistics/publications/generic-statistical-information-model-version-20-user-guide) (Generic Statistical Information Model) – UNECE/ONU.
    
    Como projeto-piloto, estamos utilizando o ementário do classificador da receita, para o qual estamos desenvolvendo uma ferramenta em ambiente aberto, disponível [neste link](https://github.com/splor-mg/classificador-receita).
    
    Na atual etapa do trabalho, estamos realizando a reconstituição da evolução histórica das classificações de receita, bem como a construção de tabelas de correspondência entre diferentes versões do classificador. Para isso, necessitamos das versões finais do ementário da receita orçamentária de anos anteriores em formatos que permitam o processamento de dados (como Excel, CSV, JSON ou qualquer outro formato de base estruturada).
    
    No [site da STN](https://www.gov.br/tesouronacional/pt-br/contabilidade-e-custos/federacao/edicoes-anteriores-ementario-da-receita-orcamentaria/edicao_anterior_ementario-da-classificacao-por-natureza-de-receita-tabela-de-codigos), localizamos arquivos em Excel para os exercícios de 
    
    - [2024](https://github.com/splor-mg/classificador-receita/blob/banco/docs/assets/referencias/ementario_receita_uniao_2024.xlsx)
    - [2023](https://github.com/splor-mg/classificador-receita/blob/banco/docs/assets/referencias/ementario_receita_uniao_2023.xlsx)
    - [2022](https://github.com/splor-mg/classificador-receita/blob/banco/docs/assets/referencias/ementario_receita_uniao_2022.xlsx)
    - [2021](https://github.com/splor-mg/classificador-receita/blob/banco/docs/assets/referencias/ementario_receita_uniao_2021.xlsx)
    - [2020](https://github.com/splor-mg/classificador-receita/blob/banco/docs/assets/referencias/ementario_receita_uniao_2020.xlsx)
    - [2018](https://github.com/splor-mg/classificador-receita/blob/banco/docs/assets/referencias/ementario_receita_uniao_2018.xlsx)
    - [2017](https://github.com/splor-mg/classificador-receita/blob/banco/docs/assets/referencias/ementario_receita_uniao_2017.xlsx)
    - [2016](https://github.com/splor-mg/classificador-receita/blob/banco/docs/assets/referencias/ementario_receita_uniao_2016.xlsx)
    - [2015](https://github.com/splor-mg/classificador-receita/blob/banco/docs/assets/referencias/ementario_receita_uniao_2015.xlsx)
    
    Gostaríamos, portanto, de solicitar, se possível, o envio das versões finais do classificador da receita para os exercícios de 2002 a 2014. Ressaltamos que qualquer formato digital disponível que facilite a leitura automatizada (Excel, CSV, TXT, etc.) será de extrema utilidade para complementar a série histórica necessária ao projeto.
    
    Caso existam observações, notas metodológicas ou registros de alterações relevantes associados a essas versões, seu compartilhamento também seria de grande valia para a correta compreensão da evolução do classificador.
    
    Agradeço desde já pela atenção e colaboração.
    
    Atenciosamente,
    
    Carlos Henrique de Oliveira Brocahdo
    carlos.oliveira@planejamento.mg.gov.br

# description

body: |-
  ### Descrição
  
  Precisamos obter, junto à STN, as versões finais do classificador da receita (ementário da receita orçamentária) em formato Excel, para os exercícios de 2002 a 2014, com o objetivo de reconstituir a evolução histórica das classificações de receita e montar tabelas de correspondência entre versões.
  
  No site da STN já estão disponíveis arquivos Excel para 2015–2024, mas não para os anos anteriores. Por isso, será necessário enviar um e-mail formal à STN solicitando esses arquivos e, se possível, documentação complementar (notas metodológicas ou registros de alterações relevantes).
  
  ## Atividades
  - [x] Abrir [protocolo junto STN](https://e-servicos.tesouro.gov.br/#/public/loginExterno) solicitando os arquivos Excel do classificador da receita (2002–2014). - protocolo CH202605231 (senha no Bitwarden da AID)
  - [x] Acompanhar a resposta e registrar neste issue o que foi recebido.
  - [x] Armazenar os arquivos recebidos no repositório/estrutura definida no projeto.
  
  
  

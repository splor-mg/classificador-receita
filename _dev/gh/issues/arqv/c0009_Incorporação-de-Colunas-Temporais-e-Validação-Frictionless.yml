# description

body: |-
  ### Descrição:
  
  Incorporar colunas temporais (valid_from, valid_to, transaction_time) no modelo de dados e configurar validação de schemas usando Frictionless Data Package. Esta issue garante que o modelo suporte bitemporalidade e tenha validação automatizada de estrutura.
  
  ### Entregas:
  
  - Modelo atualizado com colunas temporais
  - Dicionário de dados estruturado em `datapackage.yaml`
  - Schemas das entidades em `schemas/*.yaml`
  - Pipeline de validação Frictionless funcional
  - Testes de validação de schemas
  
  ### Observações:
  - Documentar formato e estrutura dos schemas

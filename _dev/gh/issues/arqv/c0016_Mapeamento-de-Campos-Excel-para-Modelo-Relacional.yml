# description

body: |-
  ### Descrição:
  
  Mapear todos os campos do Ementário Excel para o modelo relacional definido, identificando transformações necessárias, regras de negócio e tratamento de dados inconsistentes. Esta issue estabelece a ponte entre dados fonte e destino.
  
  ### Entregas:
  
  - Matriz de mapeamento Excel → Tabelas
  - Documentação de transformações necessárias
  - Regras de negócio para tratamento de dados
  - Identificação de inconsistências e lacunas
  - Plano de tratamento de dados problemáticos
  
  ### Observações:
  
  - Requer acesso completo ao Ementário Excel
  - Validar mapeamento com DCAF
  - Documentar decisões sobre tratamento de dados inconsistentes

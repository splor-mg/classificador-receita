# description

body: |-
  ### Descrição:
  
  Configurar ambiente Docker completo com PostgreSQL, volumes persistentes e Docker Compose. Implementar pipeline CI/CD básico no GitHub Actions para validação automática de scripts SQL e estrutura do banco.
  
  ### Entregas:
  
  - Docker Compose funcional (`docker-compose.yml`)
  - Configuração de volumes para persistência
  - Scripts de inicialização do ambiente
  - Pipeline CI/CD (`.github/workflows/validate.yml`)
  - Documentação de setup do ambiente
  
  ### Observações:
  
  - Ambiente Docker deve ser reproduzível
  - CI/CD deve validar DDL e DML scripts
  - Considerar múltiplos ambientes (dev, test, prod)
  
  

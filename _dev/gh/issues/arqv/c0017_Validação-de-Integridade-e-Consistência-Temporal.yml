# description

body: |-
  ### Descrição:
  
  Validar integridade referencial, consistência hierárquica, ausência de duplicidades e consistência temporal dos dados migrados. Criar scripts de validação pós-migração e executar validação Frictionless nos dados.
  
  ### Entregas:
  
  - Scripts de validação pós-migração (`tests/etl/`)
  - Validação de integridade referencial
  - Validação de hierarquia (9 níveis)
  - Validação de consistência temporal
  - Relatório de validação completo
  - Execução de validação Frictionless
  
  ### Observações:
  
  - Validações devem ser automatizadas
  - Gerar relatório de inconsistências encontradas
  - Requer aprovação da DCAF sobre tratamento de dados problemáticos

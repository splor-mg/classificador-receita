# description

body: |-
  ### Descrição
  
  Considerando que o Estado de Minas Gerais historicamente acrescentou dígitos de codificação ao ementário promulgado pela União, considerando que as tradicionais validações da estrutura do código confrontam o código atual com o número de dígitos cadastrados inicialmente para a União na tabela de Níveis Hierárquicos, e considerando que lá a informação consta com a quantidade original de dígitos, sem os acréscimos do Estado, essa conflito está gerando travamento por inconsistência no momento de criar um novo item de classificação da União.

# description

body: |-
  ### Descrição:
  
  Traduzir o Diagrama Entidade-Relacionamento (DER) para Data Definition Language (DDL), criando todas as tabelas, constraints, índices e estruturas necessárias no PostgreSQL. Esta issue materializa o modelo lógico em esquema físico executável.
  
  ### Entregas:
  
  - Scripts DDL completos (`src/sql/ddl/create_tables.sql`)
  - Criação de todas as tabelas com constraints
  - Definição de índices primários e secundários
  - Scripts de inicialização do banco
  - Validação de sintaxe SQL
  
  ### Observações:
  
  - Scripts devem ser versionados e idempotentes
  - Considerar naming conventions consistentes
  - Incluir comentários em SQL para documentação
  

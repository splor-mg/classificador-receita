body: |-
  ### Descrição:
  
  Configurar projeto Django inicial, definir estrutura de apps (core, gestao), configurar settings para PostgreSQL, configurar ambiente de desenvolvimento e estabelecer convenções de código e estrutura de diretórios.
  

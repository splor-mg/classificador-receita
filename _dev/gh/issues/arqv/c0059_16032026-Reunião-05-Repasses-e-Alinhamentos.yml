# description

body: |-
  _[ [Gravação do encontro](https://www.youtube.com/watch?v=t3Q27RuxftM&list=PLX2MgvHSaqUu1lNODdj5nqNNE6AU9mXbd&index=2&pp=iAQBsAgC) | [Reunião anterior](https://github.com/splor-mg/classificador-receita/issues/60) | [Próxima reunião](https://github.com/splor-mg/classificador-receita/issues/61) ]_
  
  ### Descrição
  
  Encontro periódico para a sincronização entre as equipes de desenvolvimento (AID) e a equipe de negócio (DCAF) dedicado ao **repasse** das implementações realizadas desde a reunião anterior e ao **alinhamento** das decisões de modelagem, regras de negócio e próximos passos do projeto.
  
  
  ## Pauta
  
  - Conclusão da implementação das operações de edição e criação no banco  
    - Garantia da **integridade temporal** 
      - Bloqueio de edição de data de vigência da "Versão atual" em "Registro de nova vigência", sendo calculado como dependência da "Data de Início de Vigência" da "Nova versão"
      - Bloqueio de Data de Fim de Vigência menor que Data de Início de Vigência
      - Quando o tipo de edição for de "Registro de nova vigência", impedir "Data de Início de Vigência" anterior à "Data de Início de Vigência" da "Versão Atual"
      - Conflito de vigência: implementada validação com mensagem apontando para edição do registro conflitante
      - Alterar harmonização de padrões de registros de triggers bitemporais:
        Considerando `ano corrente` = Y, Hoje = D (data atual):
  		- dt_vig_inicio(atual) no ano corrente e < hoje	--> Nova versão começa em D (hoje).
  		- dt_vig_inicio(atual) no ano corrente e == hoje	--> Nova versão começa em D+1 dia (amanhã).
  		- dt_vig_inicio(atual) no ano corrente e > hoje	--> Nova versão começa no dia seguinte a dt_vig_inicio(atual).
  		- dt_vig_inicio(atual) em ano futuro				--> Nova versão sugerida com início em 01/01 do ano seguinte a dt_vig_inicio(atual).
  		- dt_vig_inicio(atual) em ano anterior e dt_vig_fim(autal) é sentinela ou atinge/ultrapassa o ano corrente	--> Nova versão começa em 01/01 de Y (ano corrente).
  		- dt_vig_inicio(atual) em ano anterior e dt_vig_fim(autal) é totalmente antes de 01/01 de Y	--> Nova versão começa no dia seguinte a dt_vig_inicio(atual).
  		- qualquer caso não coberto explicitamente	-->  Fallback: nova versão começa em 01/01 de Y (ano corrente).
  		- dt_vig_inicio(atual) em ano anterior e dt_vig_fim(autal) é None ou sentinela --> 	Nova versão fica com fim sentinela.
  		- dt_vig_inicio(atual) em ano anterior e dt_vig_fim(autal) é uma data específica --> 	Nova versão copia o mesmo fim da versão atual.
  		- dt_vig_inicio(atual) no ano corrente ou futuro (sem fim explícito informado) --> 	Nova versão fica com fim sentinela.
  		- para novos registros (tela de adição), vigência vem pré-preenchida com: início em 01/01 do ano corrente e fim em sentinela, podendo ser editada livremente antes do primeiro salvamento.
  
  
     - Implementação de **mensagens dinâmicas** de orientação e alertas de consistência
     - Implementação dos protocolos de **bloqueio e exclusão**
    - Implementação do protocolo de **reativação** de registros inativos
      - Bloqueio de reativação com vigência sobreposta
      - Capacidade de editar o conteúdo dos atributos na atividade de reativação
      - _obs.: SCD-2, não se altera Data de Fim de Registro quando diferente do valor sentinela_
    - Implementação de protocolo de **criação de novo registro**
      - Normalização/padronização do identificador semântico
      - Bloqueio de criação de novo registro com fim da vigência anterior ao início
      - Bloqueio de criação de id igual a id já ativo
    
  - Replicar estrutura de `Série de Classificações` para demais recursos 
  
  ## Participantes
  - @carloshob 
  - @gabrielbdornas 
  - @Laura-Dilly 
  - @marcelatsm 
  
  ## Assuntos Tratados
  - Foram repassados todos os tópicos, em relação aos quais não houve questionamentos que implicassem em alteração da condução que tem sido feita
  - Foi ratificada a alteração dos encontros para periodicidade quinzenal, às segundas-feiras.
  
  ## Encaminhamentos
  - Continuação da implementação da modelagem padrão para os demais recursos do projeto
  - Carregamento da base inicial do classificador
  

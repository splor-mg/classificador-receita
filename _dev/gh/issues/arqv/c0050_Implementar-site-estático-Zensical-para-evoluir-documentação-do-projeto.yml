# description

body: |-
  ## Descrição
  
  Transformar documentação Markdown em site estático navegável usando [Zensical](https://zensical.org/docs/get-started/).
  
  ## Checklist
  
  - [x] 1. Instalar Zensical via Poetry
  - [x] 2. Criar `zensical.toml`
  - [x] 3. Adicionar tasks ao `pyproject.toml`
  - [x] 4. Configurar CI/CD
  - [x] 5. Habilitar GitHub Pages
  - [x] 6. Atualizar `.gitignore`
  
  ## 1. Instalação
  
  ```bash
  poetry add zensical
  ```
  
  ## 2. Configuração
  
  1. Criar `zensical.toml` na raiz do projeto com:
     - `site_name`: "Classificador de Natureza de Receita - MG"
     - `site_url`: URL de hospedagem (GitHub Pages ou servidor interno)
     - `docs_dir`: "docs" (já existe)
     - `site_dir`: "site" (será criado)
  
  2. O Zensical detecta automaticamente a estrutura em `docs/`. A estrutura atual já está adequada.
  
  
  ## Adicionar tasks ao `pyproject.toml`
  
  ```toml
  [tool.taskipy.tasks]
  build-docs = "zensical build --clean"
  serve = "zensical serve"
  ```
  
  ### Uso:
  
  - **Preview local**: `poetry run task serve` (http://localhost:8000)
  - **Build**: `poetry run task build-docs` (gera `site/`)
  
  
  ## 3. Configurar CI/CD
  
  Criar `.github/workflows/deploy-docs.yml` com workflow para:
  - Instalar Poetry e dependências
  - Instalar Zensical
  - Executar `zensical build --clean`
  - Deploy para GitHub Pages via `actions/deploy-pages@v4`
  
  
  ## 4. Habilitar GitHub Pages
  
   Habilitar GitHub Pages nas configurações do repositório (Settings > Pages > Source: GitHub Actions).
  
  
  ## 5. Ajustes Necessários
  
  1. **`.gitignore`**: Adicionar `site/` e `.zensical-cache/`
  
  2. **Diagramas ERD**: Referenciar `docs/erd/erd.png` nos arquivos Markdown quando necessário
  
  3. **Front matter (opcional)**: Adicionar metadados YAML no topo dos arquivos principais para melhor controle

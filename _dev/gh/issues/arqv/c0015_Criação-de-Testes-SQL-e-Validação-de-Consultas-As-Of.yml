# description

body: |-
  ### Descrição:
  
  Criar suite de testes SQL para validar funcionamento correto dos triggers de bitemporalidade e capacidade de realizar consultas as-of (point-in-time queries). Garantir que o banco responde corretamente a consultas temporais.
  
  ### Entregas:
  
  - Testes SQL (`tests/sql/`)
  - Testes de triggers bitemporais
  - Testes de consultas as-of
  - Testes de integridade referencial temporal
  - Relatório de cobertura de testes
  
  ### Observações:
  
  - Testes devem ser automatizados e executáveis no CI/CD
  - Cobrir casos de borda (overlaps temporais, gaps, etc.)
  - Validar performance de consultas temporais

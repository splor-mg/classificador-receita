# description

body: |-
  ### Descrição
  
  Implementar o MVP da aplicação web em Django para gestão do Classificador de Natureza de Receita, utilizando o ORM existente e os modelos bitemporais alinhados à estrutura GSIM, com foco nas funcionalidades essenciais do sistema. 
  
  O escopo inclui uma interface administrativa básica, visualização hierárquica das classificações, gestão de versões, comandos de gerenciamento para importação de dados, testes unitários iniciais e documentação de instalação e uso, priorizando CRUD básico e aderência às ADRs aprovadas, sem contemplar funcionalidades avançadas nesta fase.

# description

body: |-
  _[ [Gravação do encontro](https://www.youtube.com/playlist?list=PLX2MgvHSaqUu1lNODdj5nqNNE6AU9mXbd) | ~Reunião anterior~ | [Próxima reunião](https://github.com/splor-mg/classificador-receita/issues/56) ]_
  
  ### Descrição
  
  Encontro periódico para a sincronização entre as equipes de desenvolvimento (AID) e a equipe de negócio (DCAF) dedicado ao **repasse** das implementações realizadas desde a reunião anterior e ao **alinhamento** das decisões de modelagem, regras de negócio e próximos passos do projeto.
  
  
  ## Pauta
  - Alinhamento sobre o cronograma
  - Alinhamento sobre condução do projeto
  
  ## Participantes
  - @Laura-Dilly 
  - @carloshob 
  
  ## Alinhamentos
  - **Cronograma:** considerando que o cronograma ficou muito longo, combinamos que faremos encontros mensais no intuito de revisar o planejamento do mês subsequente.
  - **Conceitos:** alinhamos que os conceitos de relevância para o projeto, tais como de "natureza de receita", "SGDB", "CRUD" deverão ser registrados na pasta `docs/conceitos/`
  - **Fases e branches**: definimos que abriremos uma branch para cada fase/[milestone](https://github.com/splor-mg/classificador-receita/milestones)
  - **Papeis**: combinamos que as partes mais conceituais serão conduzidas pela AID. No entanto, as partes mais operacionais, o ideal é que a DCAF atue de forma mais autônoma.
  
  - **Primeira Fase - Arquitetura de dados**: 
    - #4: pontuamos o entendimento de que seria interessante nomear os atributos do banco de dados em português e, caso seja necessário fazer uma análise de compatibilidade com parâmetros internacionais, a exemplo do [GSIM](https://unece.org/statistics/publications/generic-statistical-information-model-version-20-user-guide), podemos implementar um catálogo em `docs/catalogos` com a respectiva matriz de correspondência
    - para a primeira fase, foi alinhado que a AID fará as respectivas ADR's, que serão revisadas pela DCAF.

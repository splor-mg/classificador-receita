# description

body: |-
  ### Descrição
  
  Considerando que o formato bitemporal utilizado nas tabelas prevê múltiplos registros, ativos e inativos, para uma mesma codificação, é necessário que, na ferramenta de seleção da FK associada a uma determinada classificação, é necessário que estejam disponíveis somente FK ativas.
  
  Para além disso, no submit para o banco, é necessário também validar de essa FK, para além de ativo, tem vigência correspondente ao registro atual.

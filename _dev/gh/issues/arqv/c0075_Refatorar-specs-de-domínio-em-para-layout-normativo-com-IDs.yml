# description

body: |-
  ### Descrição
  
  
  Padronizar as especificações locais de domínio para reduzir custo de contexto em assistentes de IA e tornar as regras citáveis, rastreáveis e manuteníveis antes de evoluir o classificador.
  
  ## Contexto
  
  O repositório acumulou **~16 specs de domínio** em `_dev/` (família `spec_itemClassificacao_*`, `spec_django`, `spec_importar`, `spec_validar_*`, etc.), além de **5 entradas sync do catálogo** (`spec_agents`, `spec_commits`, `spec_conventions`, `spec_issues`, `spec_version`).
  
  Na prática de desenvolvimento assistido por IA, isso tem gerado **alto consumo de tokens**: o agente precisa ler arquivos longos, com vocabulário legado heterogêneo (`(G-*)`, `(T-*)`, `(R-*)`, `B-pipe.N`, cenários `C1–C4`, …), **sem índice normativo uniforme** (tabela `| ID | Tema | Seção | Resumo |`) e sem corpo numerado consistente. 
  
  A manutenção cruzada entre specs irmãs (ex.: `spec_itemClassificacao_editar_codigo.md` ↔ `spec_itemClassificacao_navegacao.md`) é frágil.
  
  Esta demanda **não** reabre decisões de produto: trata o que **já está implementado** e documenta o contrato vigente em forma normativa.
  
  ## Objetivo
  
  Entregar as specs **locais de domínio**  no layout normativo acordado, com IDs estáveis, índice por tema e vocabulário legado migrado — **sem alterar** entradas sync do manifest.
  

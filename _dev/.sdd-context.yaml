    theme: Estrutura
    anchor: ITEMRH-05
  ITEMRH-06:
    summary: O `parent_item_id` **deve** referenciar item com `matriz = true` (mãe
      **não** pode ser detalhe).
    source: _dev/spec_itemClassificacao_regras_hierarquia.md
    theme: Estrutura
    anchor: ITEMRH-06
  ITEMRH-07:
    summary: O mãe **deve** estar no nível imediatamente anterior (`nivel_numero_mãe
      = nivel_numero_filho − 1`).

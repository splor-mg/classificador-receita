  FKVIG-01:
    summary: Esta spec trata **somente** de validação de **cobertura temporal de FK**
      (vigência do filho contida na da entidade mãe).
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Escopo
    anchor: FKVIG-01
  FKVIG-02:
    summary: Políticas de **máscara visual** e resolução estrita em UI **não** fazem
      parte desta spec — ver `spec_itemClassificacao_mascara_apresentacao.md`.
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Escopo
    anchor: FKVIG-02
  FKVIG-03:
    summary: FK Django armazena PK de **uma linha física**; a mesma entidade semântica
      pode ter **várias** linhas ativas com vigências parciais.
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Contexto
    anchor: FKVIG-03
  FKVIG-04:
    summary: A validação **deve** comparar na **entidade de negócio** (`*_ref`), não
      só na linha apontada.
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Decisão
    anchor: FKVIG-04
  FKVIG-05:
    summary: Vigência da entidade = **união contígua** das vigências de linhas com
      `data_registro_fim = sentinela` e mesmo `*_ref`.
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Decisão
    anchor: FKVIG-05
  FKVIG-06:
    summary: A FK física **continua** armazenando ponteiro para uma linha (limitação
      do ORM).
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Reaponte
    anchor: FKVIG-06
  FKVIG-07:
    summary: '`apply_temporal_fk_resolution`: uma linha ativa cobre o filho → FK nessa
      linha; senão → linha ativa **mais recente** (desempate por `data_vigencia_inicio`,
      `data_registro_inicio`, `pk`).'
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Reaponte
    anchor: FKVIG-07
  FKVIG-08:
    summary: Varredura de linhas da mesma entidade **deve** usar `*_ref` do alvo quando
      existir.
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Identidade
    anchor: FKVIG-08
  FKVIG-09:
    summary: 'Fallback: primeiro `*_id` semântico não-relacional; se ausente, PK da
      linha apontada.'
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Identidade
    anchor: FKVIG-09
  FKVIG-10:
    summary: A UI do Admin **deve** continuar exibindo `*_id` semântico; a chave de
      varredura é interna à validação.
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Identidade
    anchor: FKVIG-10
  FKVIG-11:
    summary: União contígua **somente** quando o alvo da FK herda de `BitemporalModel`.
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Aplicabilidade
    anchor: FKVIG-11
  FKVIG-12:
    summary: 'Alvo não bitemporal (ex.: `BaseLegalTecnica`): regra clássica de **linha
      única** apontada.'
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Aplicabilidade
    anchor: FKVIG-12
  FKVIG-13:
    summary: '**Não** há exclusão por modelo; toda FK many-to-one para alvo bitemporal
      é coberta. Override futuro: `temporal_fk_union_validation_exclude_fields` —
      **não** reutilizar `temporal_fk_include_fields` / `temporal_fk_exclude_fields`.'
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Aplicabilidade
    anchor: FKVIG-13
  FKVIG-14:
    summary: 'Por cada FK em `fk_fields` no `clean()`: alvo `None` (opcional) → ignorar
      silenciosamente.'
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Algoritmo
    anchor: FKVIG-14
  FKVIG-15:
    summary: '**Etapa 1:** vigência da linha apontada contém `[ini_filho, fim_filho]`
      → passa imediatamente.'
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Algoritmo
    anchor: FKVIG-15
  FKVIG-16:
    summary: '**Etapa 2:** se alvo bitemporal e Etapa 1 falhou — montar filtro de
      identidade (`*_ref`), coletar linhas ativas, calcular união contígua, verificar
      cobertura integral.'
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Algoritmo
    anchor: FKVIG-16
  FKVIG-17:
    summary: Contiguidade **estrita:** `[a,b]` e `[c,d]` fundem em `[a,d]` **somente**
      quando `c == b + 1 dia`; sobreposições (`c <= b`) **não** fundem.
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Algoritmo
    anchor: FKVIG-17
  FKVIG-18:
    summary: '**Etapa 3:** se Etapas 1 e 2 falharem → `ValidationError` com vigência
      do filho, `*_id` semântico do alvo, união consolidada e lista de **gaps**.'
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Algoritmo
    anchor: FKVIG-18
  FKVIG-19:
    summary: 'Sem gaps explícitos: mensagem com vigência do filho e união consolidada;
      com gaps: secção **Faltas:** em lista.'
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Erro
    anchor: FKVIG-19
  FKVIG-20:
    summary: União cobre integralmente o filho → **nenhum** erro.
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Erro
    anchor: FKVIG-20
  FKVIG-21:
    summary: '`VALID_TIME_SENTINEL` (`9999-12-31`): sem “próximo dia” em fusão; intervalo
      com fim sentinela é aberto à direita; gaps consideram cobertura até o fim do
      filho.'
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Sentinela
    anchor: FKVIG-21
  FKVIG-22:
    summary: Os casos mínimos de § **9** **devem** ser respeitados pela validação
      (regressão e aceite).
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Aceite
    anchor: FKVIG-22
  FKVIG-23:
    summary: Regra central em `apps/core/code_valid_time_fk_validation.py`; `clean()`
      dos cinco modelos bitemporais herdam sem alteração.
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Implementação
    anchor: FKVIG-23
  FKVIG-24:
    summary: '`_build_identity_filter` em `code_valid_time_fk_resolution.py` usa **apenas**
      `*_ref`, com fallback para `*_id` se `*_ref` vazio.'
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Implementação
    anchor: FKVIG-24
  FKVIG-25:
    summary: Varredura de linhas ativas usa sentinela de `data_registro_fim` adequado
      ao tipo do campo (aware/naive conforme `USE_TZ`).
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Implementação
    anchor: FKVIG-25
  FKVIG-26:
    summary: FK física pode apontar linha cuja vigência **sozinha** não cobre o filho
      — desencontro **intencional**; auditoria temporal consulta a união, não só a
      linha apontada.
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Trade-off
    anchor: FKVIG-26
  FKVIG-27:
    summary: '**Sem** migração de banco; mudança apenas em regra de `clean()`; dados
      existentes inalterados.'
    source: _dev/spec_foreignKeys_vigencia.md
    theme: Compatibilidade
    anchor: FKVIG-27
  IMPORT-01:
    summary: '**Importação** e **carga** (seeds → BD) **devem** ser tratadas como
      protocolos **distintos**.'
    source: _dev/spec_importar.md
    theme: Escopo
    anchor: IMPORT-01
  IMPORT-02:
    summary: O import **deve** seguir o encadeamento fonte bruta → `data-raw/` → `data/`
      → BD, conforme ADR-005.
    source: _dev/spec_importar.md
    theme: Pipeline
    anchor: IMPORT-02
  IMPORT-03:
    summary: Esta spec **deve** permanecer **transversal** — **não** acoplada exclusivamente
      a `itemClassificacao` (fallback operacional pode focar nela).
    source: _dev/spec_importar.md
    theme: Escopo
    anchor: IMPORT-03
  IMPORT-04:
    summary: Antes da persistência tratada, o pipeline **deve** executar validação
      **Frictionless** dos dados normalizados.
    source: _dev/spec_importar.md
    theme: Validação
    anchor: IMPORT-04
  IMPORT-05:
    summary: Saída tabular tratada **deve** ser gravada em `data-raw/`; entrada típica
      em `docs/assets/referencias/` quando aplicável.
    source: _dev/spec_importar.md
    theme: Artefatos
    anchor: IMPORT-05
  ISSUES-01:
    summary: Antes de criar ou sugerir issue, o autor **deve** consultar padrão existente
      em `.github/issues/` (ou path equivalente no contrato maduro) — título, corpo,
      nome de arquivo e labels.
    source: _dev/spec_issues.md
    theme: Repositório
    anchor: ISSUES-01
  ISSUES-02:
    summary: O título do issue **deve** usar **sentence case** — só a primeira palavra
      com maiúscula inicial, salvo nomes próprios, siglas e identificadores técnicos
      já capitalizados.
    source: _dev/spec_issues.md
    theme: Título
    anchor: ISSUES-02
  ISSUES-03:
    summary: Quando o repositório já usa escopo explícito, novos issues **devem**
      seguir o mesmo esquema — em geral `(<escopo>) - <descrição em sentence case>`
      — **não** inventar separador divergente.
    source: _dev/spec_issues.md
    theme: Título
    anchor: ISSUES-03
  ISSUES-04:
    summary: O autor **não deve** escrever o título inteiro em CAIXA ALTA; prefixos
      curtos acordados (`Epic:`) **podem** ter maiúscula no rótulo.
    source: _dev/spec_issues.md
    theme: Título
    anchor: ISSUES-04
  ISSUES-05:
    summary: Título e corpo do issue **devem** estar em **inglês** nesta baseline
      do catálogo — inclusive sugestões do assistente de IA; outro idioma só via `_dev/spec_<nome-repo>.md`
      § **Issues**.
    source: _dev/spec_issues.md
    theme: Idioma
    anchor: ISSUES-05
  ISSUES-06:
    summary: Contrato maduro de issues em `docs/specs/` ou `specs/` (raiz) **deve**
      prevalecer sobre cópia sync em `_dev/spec_issues.md` — ver **AGENTS-06** e §
      **1.2** em `spec_agents.md`.
    source: _dev/spec_issues.md
    theme: Precedência
    anchor: ISSUES-06
  ISSUES-07:
    summary: Nome de arquivo de issue local **deve** manter coerência com padrão numérico
      e slug já usado em `.github/issues/` — **não** proliferar formatos divergentes.
    source: _dev/spec_issues.md
    theme: Repositório
    anchor: ISSUES-07
  ISSUES-08:
    summary: 'Ao implementar trabalho rastreado por issue, o commit **deve** referenciar
      o issue conforme [`spec_commits.md`](spec_commits.md) (`See`, `Closes #N`, `Refs
      #N`) e alinhar escopo quando aplicável.'
    source: _dev/spec_issues.md
    theme: Commits
    anchor: ISSUES-08
  ITEMCEX-01:

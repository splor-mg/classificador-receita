  COMMITS-01:
    summary: 'Modo **sugestão** é o padrão: o assistente **não deve** executar `git
      add`, `git commit` nem `git push` sem autorização explícita do desenvolvedor.'
    source: _dev/spec_commits.md
    theme: Modo IA
    anchor: COMMITS-01
  COMMITS-02:
    summary: Pedidos genéricos sobre commit («ajuda com commit», «o que commitar»)
      **devem** ativar só o protocolo de sugestão § **8** — **não** autorizam execução
      real.
    source: _dev/spec_commits.md
    theme: Modo IA
    anchor: COMMITS-02
  COMMITS-03:
    summary: Execução real de Git só após pedido **explícito** do operador, com confirmação
      clicável de proposta e inclusão opcional de `git push`.
    source: _dev/spec_commits.md
    theme: Modo IA
    anchor: COMMITS-03
  COMMITS-04:
    summary: Após entregar sugestões de staging/mensagem, o assistente **deve** encerrar
      com opções clicáveis A/B/C — manual, commit sem push, ou commit com push.
    source: _dev/spec_commits.md
    theme: Modo IA
    anchor: COMMITS-04
  COMMITS-05:
    summary: Título e corpo do commit **devem** estar em **inglês** nesta baseline;
      overrides de idioma só em `_dev/spec_<nome-repo>.md` § **Commits** (**AGENTS-10**).
    source: _dev/spec_commits.md
    theme: Idioma
    anchor: COMMITS-05
  COMMITS-06:
    summary: Linhas `See …` **devem** ser copiadas só de `_dev/_dev.md` quando existirem
      — o assistente **não deve** inventar URLs ou placeholders.
    source: _dev/spec_commits.md
    theme: Mensagem
    anchor: COMMITS-06
  COMMITS-07:
    summary: Diff **apenas** de documentação normativa (`spec_*.md`, README descritivo)
      **deve** usar tipo `docs` — **não** `feat` por ser «feature conceptual».
    source: _dev/spec_commits.md
    theme: Tipo
    anchor: COMMITS-07
  COMMITS-08:
    summary: O assistente **não deve** sugerir `git add` de credenciais (`.env`, chaves
      privadas, tokens) nem arquivos sensíveis equivalentes.
    source: _dev/spec_commits.md
    theme: Staging
    anchor: COMMITS-08
  COMMITS-09:
    summary: O assistente **não deve** executar `dev-td-up` (commit+push automáticos)
      sem pedido **explícito** do operador.
    source: _dev/spec_commits.md
    theme: Staging
    anchor: COMMITS-09
  COMMITS-10:
    summary: Contrato maduro de commits em `docs/specs/` ou `specs/` (raiz) **deve**
      prevalecer sobre cópia sync `_dev/spec_commits.md` — **AGENTS-06**, § **1.2**.
    source: _dev/spec_commits.md
    theme: Precedência
    anchor: COMMITS-10
  COMMITS-11:
    summary: No corpo do commit, **deve** preferir descrever comportamento aplicado
      — **não** citar IDs transitórios de `_dev/spec_*` salvo quando o commit altera
      a própria regra.
    source: _dev/spec_commits.md
    theme: Mensagem
    anchor: COMMITS-11
  COMMITS-12:
    summary: Com `CHANGELOG.md`, o commit de implementação **deve** atualizar `[Unreleased]`
      no mesmo commit; Perfil B lockstep fecha `## [versão]` no bump de `version:`
      (**VERSION-15**, **VERSION-16**).
    source: _dev/spec_commits.md
    theme: Changelog
    anchor: COMMITS-12
  COMMITS-13:
    summary: Commits user-facing com `CHANGELOG.md` **devem** separar **causa** (título/corpo)
      de **impacto** via trailer `Impact:` em inglês — candidato a bullet KAC.
    source: _dev/spec_commits.md
    theme: Mensagem
    anchor: COMMITS-13
  COMMITS-14:
    summary: Trailers `Changelog-*` só quando tipo CC + `Impact:` + heurísticas de
      diff **não** bastam; preferir inferir seção KAC antes de trailers explícitos.
    source: _dev/spec_commits.md
    theme: Changelog
    anchor: COMMITS-14
  COMMITS-15:
    summary: Sugestões de commit **devem** usar HEREDOC integral; incluir `Impact:`
      quando aplicável (**COMMITS-13**) e bloco `See` só conforme **COMMITS-06**.
    source: _dev/spec_commits.md
    theme: Staging
    anchor: COMMITS-15
  COMMITS-16:
    summary: Ao concluir implementação com alterações rastreáveis, o assistente **deve**
      seguir § **8.0** (versionamento + changelog + **sugerir** `git add` + HEREDOC
      no chat) — **não** **executar** Git (**AGENTS-20**, **COMMITS-01**).
    source: _dev/spec_commits.md
    theme: Modo IA
    anchor: COMMITS-16
  CONTEXT-01:
    summary: O contexto SDD compilado **deve** residir em `_dev/.sdd-context.yaml`
      na raiz do consumidor — **não** substituir por pasta `.sdd/` ou outro layout
      sem norma explícita no contrato maduro.
    source: _dev/spec_context.md
    theme: Artefato
    anchor: CONTEXT-01
  CONTEXT-02:
    summary: Operador e assistente **não devem** editar `_dev/.sdd-context.yaml` à
      mão; alterações normativas vão para specs fonte e o artefato **deve** ser regenerado
      com `sdd context compile`.
    source: _dev/spec_context.md
    theme: Artefato
    anchor: CONTEXT-02
  CONTEXT-03:
    summary: O consumidor **deve** executar `sdd context compile` após sync de specs,
      bump de `areas.*`, alteração de overrides locais ou primeira adopção desta norma.
    source: _dev/spec_context.md
    theme: Artefato
    anchor: CONTEXT-03
  CONTEXT-04:
    summary: '`_dev/.sdd-context.yaml` **deve** ser versionado no Git do consumidor;
      commit com escopo `context` quando o diff principal for só o artefato — **não**
      adicionar entrada `entries.*` no manifest.'
    source: _dev/spec_context.md
    theme: Artefato
    anchor: CONTEXT-04
  CONTEXT-05:
    summary: O artefato compilado complementa **AGENTS-22** — operador **pode** anexar
      `@`; assistente **deve** usar `rules`/`tasks` como índice e **não deve** dispensar
      leitura integral de specs quando exigida.
    source: _dev/spec_context.md
    theme: Assistente
    anchor: CONTEXT-05
  CONTEXT-06:
    summary: 'O gerador **deve** emitir YAML com `schema_version: 1`; evolução para
      versões superiores **deve** ser documentada nesta spec antes de consumidores
      adotarem.'
    source: _dev/spec_context.md
    theme: Esquema
    anchor: CONTEXT-06
  CONTEXT-07:
    summary: 'Campos top-level v1 **obrigatórios**: `schema_version`, `generated_at`,
      `generator`, `repo`, `catalog`, `consumer`, `sources`, `rules`, `tasks`, `path_scopes`
      — lista `sources` **gerada** em runtime.'
    source: _dev/spec_context.md
    theme: Esquema
    anchor: CONTEXT-07
  CONTEXT-08:
    summary: Comando canônico **`sdd context compile`** — implementação em `computer-setup/toolkit/sdd/context_compile.py`;
      detalhes operacionais ficam em `toolkit/sdd/specs/`, **não** duplicados aqui
      salvo norma transversal nova.
    source: _dev/spec_context.md
    theme: Gerador
    anchor: CONTEXT-08
  CONTEXT-09:
    summary: Resolução de `rules` em quatro passos (sync → local `_dev/` → contrato
      maduro → hub § **2** só fallback); ID já presente **pode** ser sobrescrito pelo
      passo seguinte; passo 4 só acrescenta ausentes.
    source: _dev/spec_context.md
    theme: Compilação
    anchor: CONTEXT-09
  CONTEXT-10:
    summary: 'Alvo de extração semântica: índice 4 colunas + camadas 2–6 do contrato
      § **9.11** (**CONV-37**); coluna **Resumo** alimenta `rules.<ID>.summary`; **Tema**
      disponível para filtros RAG.'
    source: _dev/spec_context.md
    theme: Compilação
    anchor: CONTEXT-10
  CONV-01:
    summary: Ao registrar convenção transversal neste arquivo ou equivalente, o autor
      **deve** incluir definição, onde vale, inventário e regra de manutenção conforme
      § **3**.
    source: _dev/spec_conventions.md
    theme: Registro
    anchor: CONV-01
  CONV-02:
    summary: Variáveis de ambiente, paths e aliases compartilhados **devem** ter inventário
      canônico em § **4** deste arquivo; scripts e assistente **não devem** inventar
      defaults dispersos.
    source: _dev/spec_conventions.md
    theme: Configuração
    anchor: CONV-02
  CONV-03:
    summary: Antes de definir default para conceito já no inventário § **4**, o autor
      **deve** reutilizar nome e valor canônico — **não deve** duplicar.
    source: _dev/spec_conventions.md
    theme: Configuração
    anchor: CONV-03
  CONV-04:
    summary: Ao criar ou obsoletar ID em qualquer spec do catálogo, o mantenedor **deve**
      atualizar hub § **2** e o índice local **Como citar** da spec protagonista.
    source: _dev/spec_conventions.md
    theme: Hub
    anchor: CONV-04
  CONV-05:
    summary: Alterações ao modelo compartilhável do catálogo **devem** elevar-se ao
      upstream `docs/spec_conventions.md` — ver **AGENTS-26**; consumidor registra
      só exceções locais.
    source: _dev/spec_conventions.md
    theme: Manutenção
    anchor: CONV-05
  CONV-06:
    summary: Tags Git de release **devem** usar prefixo `v` + SemVer alinhado a `manifest.yaml`
      ou `CHANGELOG.md`; preferir tag anotada na branch estável.
    source: _dev/spec_conventions.md
    theme: Git
    anchor: CONV-06
  CONV-07:
    summary: Inventário de tags Git **deve** residir em `spec_<nome-repo>.md` ou contrato
      maduro — **não deve** gravar-se em `_dev/spec_conventions.md` sync (**AGENTS-07**).
    source: _dev/spec_conventions.md
    theme: Git
    anchor: CONV-07
  CONV-08:
    summary: 'Entry shell sourced **deve** seguir ordem fixa de blocos no `<tool>.sh`:
      bootstrap, runtime, normalizer, help, orchestrator — § **6.2**.'
    source: _dev/spec_conventions.md
    theme: Shell
    anchor: CONV-08
  CONV-09:
    summary: Orchestrator público **deve** chamar-se `<tool>()` em scripts sourced
      — **não deve** usar `main()`; ver § **6.1** e § **6.3**.
    source: _dev/spec_conventions.md
    theme: Shell
    anchor: CONV-09
  CONV-10:
    summary: Helpers privados de entry shell **devem** usar prefixo `_<tool>_`; funções
      públicas em libs sourced usam `<tool>_` sem underscore inicial.
    source: _dev/spec_conventions.md
    theme: Shell
    anchor: CONV-10
  CONV-11:
    summary: Arquivo `<tool>.sh` **deve** expor `_<tool>_normalize_action` mapeando
      aliases para tokens canônicos antes do dispatch.
    source: _dev/spec_conventions.md
    theme: Shell
    anchor: CONV-11
  CONV-12:
    summary: Aliases `help`, `-h` e `--help` **devem** normalizar para canônica `help`;
      dispatch **não deve** usar `-h` como token interno.
    source: _dev/spec_conventions.md
    theme: Shell
    anchor: CONV-12
  CONV-13:
    summary: Implementação de help **deve** residir em `_<tool>_show_help` no entry;
      texto longo fica na spec do tool.
    source: _dev/spec_conventions.md
    theme: Shell
    anchor: CONV-13
  CONV-14:
    summary: Atalhos `<tool>-h` **devem** existir só no profile — **não devem** definir-se
      no entry shell sourced.
    source: _dev/spec_conventions.md
    theme: Shell
    anchor: CONV-14
  CONV-15:
    summary: Scripts **devem** distinguir modo sourced (`<tool>()`) de executável
      (`main "$@"`) conforme § **6.8**.
    source: _dev/spec_conventions.md
    theme: Shell
    anchor: CONV-15
  CONV-16:
    summary: Primeira linha de entry shell sourced **deve** ser `#!/usr/bin/env bash`
      — **não deve** usar `#!/bin/bash` salvo exceção documentada.
    source: _dev/spec_conventions.md
    theme: Shell
    anchor: CONV-16
  CONV-17:
    summary: Entry `<tool>.sh` **deve** permanecer orquestrador enxuto; cada canônica
      do normalizer **deve** mapear a exatamente um delegate.
    source: _dev/spec_conventions.md
    theme: Shell
    anchor: CONV-17
  CONV-18:
    summary: Ferramentas em `toolkit/<tool>/` **devem** documentar-se em `spec_<tool>.md`
      (hub) e `spec_<stem>.md` (módulo) — § **1.3**.
    source: _dev/spec_conventions.md
    theme: Toolkit
    anchor: CONV-18
  CONV-19:
    summary: Migration neste catálogo designa passo one-shot idempotente de layout
      — **não** migration de base de dados; ver § **8.1**.
    source: _dev/spec_conventions.md
    theme: Migration
    anchor: CONV-19
  CONV-20:
    summary: Registar migration quando evolução depreca path, arquivo ou chave que
      consumidores **podem** já ter no ambiente.
    source: _dev/spec_conventions.md
    theme: Migration
    anchor: CONV-20
  CONV-21:
    summary: Migrations **devem** correr antes do fluxo que assume layout atual; implementação
      em bloco dedicado sourced ou invocado cedo.
    source: _dev/spec_conventions.md
    theme: Migration
    anchor: CONV-21
  CONV-22:
    summary: Migrations **devem** ser idempotentes, detectar legado primeiro, confirmar
      ações destrutivas e falhar de forma segura ao cancelamento.
    source: _dev/spec_conventions.md
    theme: Migration
    anchor: CONV-22
  CONV-23:
    summary: Cada ferramenta com migrations **deve** documentá-las no spec do módulo
      e referenciar no hub `spec_<tool>.md`.
    source: _dev/spec_conventions.md
    theme: Migration
    anchor: CONV-23
  CONV-24:
    summary: Ao deprecar layout consumível, assistente **deve** registrar migration,
      documentar e avaliar SemVer — **não deve** assumir ambiente já atualizado.
    source: _dev/spec_conventions.md
    theme: Migration
    anchor: CONV-24
  CONV-25:
    summary: Prompts interativos de scripts `toolkit/<tool>/` **devem** estar em inglês
      — specs PT-BR **não** autorizam diálogos traduzidos no código.
    source: _dev/spec_conventions.md
    theme: CLI
    anchor: CONV-25
  CONV-26:
    summary: CLI hierárquica **deve** adotar `<tool> [<domínio>] [<verbo>]` com normalizers
      de domínio e verbo documentados no hub da ferramenta.
    source: _dev/spec_conventions.md
    theme: CLI
    anchor: CONV-26
  CONV-27:
    summary: Templates de prompt IA **devem** registrar-se no domínio canônico `prompt`/`prm`
      com registry Python — ver **AGENTS-29**.
    source: _dev/spec_conventions.md
    theme: CLI
    anchor: CONV-27
  CONV-28:
    summary: Flags booleanas componíveis **podem** acumular após o verbo; modos exclusivos
      **devem** documentar-se na spec do módulo.
    source: _dev/spec_conventions.md
    theme: CLI
    anchor: CONV-28
  CONV-29:
    summary: Branches de trabalho **devem** usar `<tipo>/<slug>` em kebab-case; branch
      estável `main` **não deve** servir de prefixo operacional.
    source: _dev/spec_conventions.md
    theme: Git
    anchor: CONV-29
  CONV-30:
    summary: 'CLIs Python interativos **devem** sanitizar SIGINT: sem traceback, mensagem
      `Cancelled.`, exit **130**; aviso se alterações parciais possíveis.'
    source: _dev/spec_conventions.md
    theme: CLI
    anchor: CONV-30
  CONV-31:
    summary: Módulos Python reutilizados **devem** residir em `toolkit/<tool>/` de
      afinidade — **não devem** ficar soltos na raiz `toolkit/`.
    source: _dev/spec_conventions.md
    theme: Toolkit
    anchor: CONV-31
  CONV-32:
    summary: Toda spec normativa **deve** seguir esqueleto fixo em PT-BR; exemplos
      de output de terminal, prompts interativos e estruturas de diálogo citados na
      spec **devem** estar em inglês (**CONV-25**).
    source: _dev/spec_conventions.md
    theme: Spec
    anchor: CONV-32
  CONV-33:
    summary: Índice local **deve** usar quatro colunas `ID
    source: _dev/spec_conventions.md
    theme: Spec
    anchor: CONV-33
  CONV-34:
    summary: Coluna **Resumo** **deve** ser frase autônoma PT-BR (~25–55 palavras)
      com quem, modal, ação, contexto e dependências.
    source: _dev/spec_conventions.md
    theme: Spec
    anchor: CONV-34
  CONV-35:
    summary: Cada ID no índice **deve** ter âncora `**(PREFIX-NN)**` no corpo e cada
      norma citável **deve** ter linha no índice.
    source: _dev/spec_conventions.md
    theme: Spec
    anchor: CONV-35
  CONV-36:
    summary: Criar ID para obrigação RFC 2119, contrato ou mensagem fixa; **não**
      criar ID para exemplo, pendência ou ADR sem norma derivada.
    source: _dev/spec_conventions.md
    theme: Spec
    anchor: CONV-36
  CONV-37:
    summary: Specs **devem** adotar contrato de compilação em seis camadas (índice,
      âncoras, metadados, norma, aceite, mensagens) — **CONTEXT-10**.
    source: _dev/spec_conventions.md
    theme: Spec
    anchor: CONV-37
  CONV-38:
    summary: Símbolos normativos compartilhados em ≥2 specs **devem** migrar para
      glossário `PREFIX-GL-NN` registrado no repo-spec.
    source: _dev/spec_conventions.md
    theme: Spec
    anchor: CONV-38
  DJANGO-01:

    theme: Estrutura
    anchor: ITEMRH-09
  ITEMRH-10:
    summary: Campos com zeros canônicos **devem** ser tratados como **não discriminados**.
    source: _dev/spec_itemClassificacao_regras_hierarquia.md
    theme: Semântica
    anchor: ITEMRH-10
  ITEMRH-11:
    summary: A vigência do mãe **deve conter integralmente** a vigência do filho (eixo
      temporal exigido para este vínculo na validação de domínio).
    source: _dev/spec_itemClassificacao_regras_hierarquia.md
    theme: Temporal
    anchor: ITEMRH-11
  ITEMRH-12:
    summary: 'Filho nível `N`: segmentos `1..N−1` do mãe **devem** ser iguais aos

    theme: Estrutura
    anchor: ITEMRH-07
  ITEMRH-08:
    summary: '`nivel_id` **deve** coincidir com o nível inferido de `receita_cod`;
      divergência → erro em `nivel_id` (Admin: **R-nivel-submit**; servidor: `validate_item_nivel_id_receita_cod_derivation`).'
    source: _dev/spec_itemClassificacao_regras_hierarquia.md
    theme: Estrutura
    anchor: ITEMRH-08

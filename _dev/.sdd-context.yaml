    anchor: ITEMVH-37
  LISTABR-10:
    summary: '**(i)** `segmento` — partes separadas por ` - `.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Notação
  LISTABR-100:
    summary: Casos § **14** (PF, **(M)**, regressões **1.2**).
    source: _dev/spec_lista_abreviacoes.md
    theme: Teste
  LISTABR-11:
    summary: '**(ii)** `abreviação` — sigla, encurtamento, remoção de conectivos.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Notação
  LISTABR-12:
    summary: '**(iii)** abreviação simples — só remoção de conectivos.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Notação
  LISTABR-13:
    summary: '**(iv)** abreviação por encurtamento (`Rec.`, `Princ.`).'
    source: _dev/spec_lista_abreviacoes.md
    theme: Notação
  LISTABR-14:
    summary: '**(v)** `sigla` — letras maiúsculas contíguas.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Notação
  LISTABR-15:
    summary: '**(vi)** redundância composicional — **Regra 7**.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Notação
  LISTABR-16:
    summary: '**(vii)** `termo_nome` canônico lexical.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Notação
  LISTABR-17:
    summary: '**(viii)** termo inválido se contém token **(iv)** (excepção **1.2.5**).'
    source: _dev/spec_lista_abreviacoes.md
    theme: Notação
  LISTABR-20:
    summary: '**(A)** colunas do modelo; `termo` ≡ `termo_nome` no CSV.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Política
  LISTABR-21:
    summary: '**(A′)** validação **(vii)**/**(viii)** em todo INSERT.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Política
  LISTABR-22:
    summary: '**(B)** INSERT só se `termo` novo; sem UPDATE automático.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Política
  LISTABR-23:
    summary: '**(C)** conflito silencioso na mesma execução.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Política
  LISTABR-24:
    summary: '**(E)** ordem das regras PF/ND.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Política
  LISTABR-25:
    summary: '**(M)** omissão por junção `termo + abreviacao` no mapa.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Política
  LISTABR-26:
    summary: '**(F)** `--print-conflicts` / `--print-conflicts-resolve`.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Política
  LISTABR-30:
    summary: Instante **T**, filho/mãe ativos e vigência orçamentária.
    source: _dev/spec_lista_abreviacoes.md
    theme: Vigência
  LISTABR-31:
    summary: Unicidade `LOWER(termo)` (`unique_lista_abrev_termo_ci`).
    source: _dev/spec_lista_abreviacoes.md
    theme: BD
  LISTABR-38:
    summary: '**(H)** `LEXICO_CONNECTIVOS_FIXOS` — SSOT.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Conectivo
  LISTABR-40:
    summary: Export seed via `export_resource`; critério «nova linha».
    source: _dev/spec_lista_abreviacoes.md
    theme: Export
  LISTABR-50:
    summary: '**Regra 1** — mãe monosegmento; 1.º segmento filho abrevia mãe.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Regra PF
  LISTABR-51:
    summary: '**Regra 1.2** — caminhos A/B; **1.2.9**; filtro **(M)**.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Regra PF
  LISTABR-52:
    summary: '**Regra 2** — 2 segmentos; sigla no 2.º.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Regra ND
  LISTABR-53:
    summary: '**Regra 3** — sigla entre parênteses no fim.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Regra ND
  LISTABR-54:
    summary: '**Regra 4** — alinhamento segmento-a-segmento; cabeça+sigla.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Regra PF
  LISTABR-55:
    summary: '**Regra 5** — junção de abreviações A+B.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Regra PF
  LISTABR-56:
    summary: '**Regra 6** — derivação atômica pós-processamento.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Regra ND
  LISTABR-57:
    summary: '**Regra 7** — omissão por redundância composicional.'
    source: _dev/spec_lista_abreviacoes.md
    theme: Regra ND
  PREFIX-01:
    summary: …
    source: _dev/spec_conventions.md
    theme: Layout
  PREFIX-02:
    summary: change
    source: _dev/spec_conventions.md
    theme: UI+Admin
    anchor: PREFIX-02
  VALCOD-01:
    summary: O código canónico (`receita_cod`) **deve** ser tratado como atributo
      do item; `numero_digitos` **deve** vir da classificação estatística (GSIM).
    source: _dev/spec_validar_codigos.md
    theme: Alinhamento
    anchor: VALCOD-01
  VALCOD-02:
    summary: 'A resolução **deve** considerar **duas** dimensões temporais: vigência
      (mundo) e registro (sistema).'
    source: _dev/spec_validar_codigos.md
    theme: Alinhamento
    anchor: VALCOD-02
  VALCOD-03:
    summary: Entradas **devem** ser linhas de `item_classificacao` e linhas de classificação
      (CSV/YAML de referência).
    source: _dev/spec_validar_codigos.md
    theme: Dados
    anchor: VALCOD-03
  VALCOD-04:
    summary: A validação **deve** **começar** pelo período de **registro** do item,
      **não** pela vigência.
    source: _dev/spec_validar_codigos.md
    theme: Registro
    anchor: VALCOD-04
  VALCOD-05:
    summary: Por linha de item, o script **deve** usar `data_registro_inicio` e `data_registro_fim`
      da própria linha.
    source: _dev/spec_validar_codigos.md
    theme: Registro
    anchor: VALCOD-05
  VALCOD-06:
    summary: Na tabela de classificação, **devem** permanecer apenas linhas da mesma
      `classificacao_id` cujo intervalo de **registro** **compreenda** o do item.
    source: _dev/spec_validar_codigos.md
    theme: Registro
    anchor: VALCOD-06
  VALCOD-07:
    summary: A **vigência** **deve** ser aplicada após o filtro de registro; **não
      deve** ser desconsiderada.
    source: _dev/spec_validar_codigos.md
    theme: Vigência
    anchor: VALCOD-07
  VALCOD-08:
    summary: Entre linhas já filtradas por registro, **devem** permanecer só as cuja
      **vigência** **compreenda** a vigência do item (`data_vigencia_inicio` / `data_vigencia_fim`).
    source: _dev/spec_validar_codigos.md
    theme: Vigência
    anchor: VALCOD-08
  VALCOD-09:
    summary: 'A ordem **deve** ser: (1) filtrar por registro; (2) filtrar por vigência.'
    source: _dev/spec_validar_codigos.md
    theme: Ordem
    anchor: VALCOD-09
  VALCOD-10:
    summary: '**Pode** haver **mais de uma** linha de classificação compatível com
      registro e vigência do item.'
    source: _dev/spec_validar_codigos.md
    theme: Critério
    anchor: VALCOD-10
  VALCOD-11:
    summary: O teste **deve** ser **válido** quando `len(receita_cod)` corresponde
      ao `numero_digitos` de **cada** linha encontrada.
    source: _dev/spec_validar_codigos.md
    theme: Critério
    anchor: VALCOD-11
  VALCOD-12:
    summary: Todas as linhas encontradas **devem** ter o **mesmo** `numero_digitos`.
    source: _dev/spec_validar_codigos.md
    theme: Critério
    anchor: VALCOD-12
  VALCOD-13:
    summary: O teste **deve falhar** se **nenhuma** linha de classificação atender
      registro e vigência compatíveis.
    source: _dev/spec_validar_codigos.md
    theme: Falha
    anchor: VALCOD-13
  VALCOD-14:
    summary: O teste **deve falhar** se linhas encontradas tiverem `numero_digitos`
      **diferentes** entre si.
    source: _dev/spec_validar_codigos.md
    theme: Falha
    anchor: VALCOD-14
  VALCOD-15:
    summary: O teste **deve falhar** se `numero_digitos` for único mas `len(receita_cod)`
      for **diferente** desse valor.
    source: _dev/spec_validar_codigos.md
    theme: Falha
    anchor: VALCOD-15
  VALCOD-16:
    summary: 'Entry point canónico: `scripts/validate_code.py`.'
    source: _dev/spec_validar_codigos.md
    theme: CLI
    anchor: VALCOD-16
  VALCOD-17:
    summary: 'Tasks Poetry: `poetry run task validar-codigos`; `poetry run task validar-tudo`
      inclui schemas, códigos e qualidade.'
    source: _dev/spec_validar_codigos.md
    theme: CLI
    anchor: VALCOD-17
  VALCOD-18:
    summary: Flags `--items` e `--niveis` **devem** permitir sobrescrever CSV de itens
      e de classificação.
    source: _dev/spec_validar_codigos.md
    theme: CLI
    anchor: VALCOD-18
  VALCOD-19:
    summary: Se o arquivo de itens **não existir**, o script **deve** terminar com
      exit **0** e mensagem informativa — **não** falhar o pipeline.
    source: _dev/spec_validar_codigos.md
    theme: CLI
    anchor: VALCOD-19
  VALCOD-20:
    summary: A regra e o script **devem** estar documentados em `schemas/item_classificacao.yaml`
      em `custom.codeValidation`.
    source: _dev/spec_validar_codigos.md
    theme: Schema
    anchor: VALCOD-20
  VALQUAL-01:
    summary: O script **deve** ser **independente** de `validate_datapackage.py` e
      **deve** operar sobre **dados** de recursos, não só sobre descriptors. **(VALQUAL-02)**
    source: _dev/spec_validar_qualidade.md
    theme: Escopo
    anchor: VALQUAL-01
  VALQUAL-02:
    summary: '`validate_datapackage.py` **não deve** acionar `validate_quality.py`;
      são comandos distintos.'
    source: _dev/spec_validar_qualidade.md
    theme: Escopo
    anchor: VALQUAL-02
  VALQUAL-03:
    summary: Cada expressão em `quality_rules.yaml` **deve** usar apenas campos da
      **própria linha** do recurso avaliado.
    source: _dev/spec_validar_qualidade.md
    theme: Regras
    anchor: VALQUAL-03
  VALQUAL-04:
    summary: O script **deve** carregar `datapackage.yaml` e percorrer `resources`.
    source: _dev/spec_validar_qualidade.md
    theme: Pipeline
    anchor: VALQUAL-04
  VALQUAL-05:
    summary: Por recurso, o script **deve** ler o schema em `schema` e aplicar regras
      só se existir `custom.qualityDimensions` com `rulesRef` e `ruleSets`.
    source: _dev/spec_validar_qualidade.md
    theme: Pipeline
    anchor: VALQUAL-05
  VALQUAL-06:
    summary: O script **deve** carregar o arquivo YAML referenciado por `rulesRef`
      e resolver os `ruleSets` indicados no schema.
    source: _dev/spec_validar_qualidade.md
    theme: Pipeline
    anchor: VALQUAL-06
  VALQUAL-07:
    summary: O script **deve** carregar o CSV em `path` (relativo à raiz do projeto);
      se o arquivo **não existir**, **deve** ignorar o recurso com **aviso** — **não**
      abortar o lote.
    source: _dev/spec_validar_qualidade.md
    theme: Dados
    anchor: VALQUAL-07
  VALQUAL-08:
    summary: Para cada regra aplicável, o script **deve** avaliar `expression` em
      **cada linha**; falha (falso ou erro) **deve** ser registrada.
    source: _dev/spec_validar_qualidade.md
    theme: Avaliação
    anchor: VALQUAL-08
  VALQUAL-09:
    summary: O processo **deve** emitir relatório por recurso/regra/linha e **deve**
      terminar com código de saída **1** se houver pelo menos um erro.
    source: _dev/spec_validar_qualidade.md
    theme: Saída
    anchor: VALQUAL-09
  VALQUAL-10:
    summary: O projeto **deve** declarar **PyYAML** para ler `datapackage.yaml` e
      `quality_rules.yaml`.
    source: _dev/spec_validar_qualidade.md
    theme: Dependência
    anchor: VALQUAL-10
  VALQUAL-11:
    summary: 'Entry point canónico: `scripts/validate_quality.py`.'
    source: _dev/spec_validar_qualidade.md
    theme: CLI
    anchor: VALQUAL-11
  VALQUAL-12:
    summary: 'Tasks Poetry: `poetry run task validar-qualidade`; `poetry run task
      validar-tudo` inclui schemas, códigos e qualidade.'
    source: _dev/spec_validar_qualidade.md
    theme: CLI
    anchor: VALQUAL-12
  VALQUAL-13:
    summary: Flags `--datapackage` e `--quality-rules` **devem** permitir sobrescrever
      caminhos do datapackage e do arquivo de regras.
    source: _dev/spec_validar_qualidade.md
    theme: CLI
    anchor: VALQUAL-13
  VERSION-01:
    summary: Antes de concluir tarefa com alterações no repo, o responsável **deve**
      avaliar SemVer ou «sem bump» **e aplicar** bumps em arquivos de versionamento
      e `CHANGELOG` quando existirem (**AGENTS-20**).
    source: _dev/spec_version.md
    theme: Avaliação
    anchor: VERSION-01
  VERSION-02:
    summary: 'Classificação SemVer **deve** seguir tabela § **3**: MAJOR = incompatível;
      MINOR = extensão compatível; PATCH = correção sem mudar obrigação.'
    source: _dev/spec_version.md
    theme: Avaliação
    anchor: VERSION-02
  VERSION-03:
    summary: Catálogo **deve** declarar `version:` primário e rastreio secundário
      `areas.<entry>` no `manifest.yaml` — **não** versionar cada `spec_*.md` isoladamente.
    source: _dev/spec_version.md
    theme: Manifesto
    anchor: VERSION-03
  VERSION-04:
    summary: Ao decidir qual spec foi alterada, **deve** aplicar precedência § **1.2**
      em `spec_agents.md` antes de classificar bump.
    source: _dev/spec_version.md
    theme: Avaliação
    anchor: VERSION-04
  VERSION-05:
    summary: Alteração em `_dev/spec_*.md` **deve** distinguir regra local do consumidor
      vs padrão elevável upstream — ver **AGENTS-26**.
    source: _dev/spec_version.md
    theme: Avaliação
    anchor: VERSION-05
  VERSION-06:
    summary: Promoção de norma de `_dev/` para contrato maduro (`docs/specs/` ou `specs/`)
      **deve** trigger revisão de versionamento e commits.
    source: _dev/spec_version.md
    theme: Avaliação
    anchor: VERSION-06
  VERSION-07:
    summary: Com bump publicável, o assistente **deve** sugerir comandos `git tag`
      copiáveis ao operador — **não** executar tag/push (**VERSION-08**, **AGENTS-18**).
    source: _dev/spec_version.md
    theme: Tags
    anchor: VERSION-07
  VERSION-08:
    summary: O assistente **não deve** executar `git tag`, `git push origin vX.Y.Z`
      nem `git push --tags` sem pedido **explícito** do operador.
    source: _dev/spec_version.md
    theme: Tags
    anchor: VERSION-08
  VERSION-09:
    summary: Projetos com `CHANGELOG.md` **devem** manter `[Unreleased]` alinhado
      a tags, pré-releases e estado do manifesto.
    source: _dev/spec_version.md
    theme: Changelog
    anchor: VERSION-09
  VERSION-10:
    summary: Núcleo de `version:` **não deve** ser menor que o núcleo de qualquer
      outro campo SemVer no mesmo manifesto.
    source: _dev/spec_version.md
    theme: Manifesto
    anchor: VERSION-10
  VERSION-11:
    summary: Núcleo de entrada em grupo filho (ex. `toolkit.gtt`) **não deve** exceder
      núcleo de `areas.<nome>` homônimo.
    source: _dev/spec_version.md
    theme: Manifesto
    anchor: VERSION-11
  VERSION-12:
    summary: Seção YAML de grupo filho versionado **deve** ter o mesmo nome que a
      chave do agregador pai em `areas.*`.
    source: _dev/spec_version.md
    theme: Manifesto
    anchor: VERSION-12
  VERSION-13:
    summary: Todo bump declarado num campo versionado **deve** propagar PATCH/MINOR/MAJOR
      na cadeia ascendente até `version:` na mesma tarefa.
    source: _dev/spec_version.md
    theme: Manifesto
    anchor: VERSION-13
  VERSION-14:
    summary: '`CHANGELOG.md` **deve** seguir Keep a Changelog: eixos versão × tipo;
      bullets de impacto perceptível; omitir tipos vazios.'
    source: _dev/spec_version.md
    theme: Changelog
    anchor: VERSION-14
  VERSION-15:
    summary: 'Perfil B lockstep (adotado): fechar `## [X.Y.Z] - data` no **mesmo commit**
      do bump de `version:` — **não** só após tag.'
    source: _dev/spec_version.md
    theme: Changelog
    anchor: VERSION-15
  VERSION-16:
    summary: Seções `## [X.Y.Z]` cuja tag `vX.Y.Z` existe no remoto são **imutáveis**
      — bullets novos vão para `[Unreleased]` ou nova versão.
    source: _dev/spec_version.md
    theme: Changelog
    anchor: VERSION-16
  VERSION-17:
    summary: Ao criar `## [X.Y.Z] - DATA`, se outra seção já usa a mesma `DATA`, o
      cabeçalho **deve** incluir sufixo `(N)` — ver checklist § **8.6** (**VERSION-17**).
    source: _dev/spec_version.md
    theme: Changelog
    anchor: VERSION-17
  VERSION-18:
    summary: Em branch de trabalho com sufixo `-alpha`/`-beta`/`-rc`, após fixar o
      núcleo SemVer face à última tag estável em `main`, entregas intermediárias **devem**
      incrementar só o sufixo pré-release — **não** PATCH/MINOR/MAJOR adicionais no
      núcleo de `version:` na mesma branch.
    source: _dev/spec_version.md
    theme: Pré-release
    anchor: VERSION-18
